<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src *; img-src 'self' data:;">
<title>DayTask</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0f1117;
    --bg2: #161b27;
    --bg3: #1e2535;
    --line: #252d40;
    --accent: #3dd68c;
    --accent2: #5b9cf6;
    --warn: #f5a623;
    --danger: #e05c5c;
    --text: #d4dbe8;
    --muted: #5a6480;
    --done-text: #3a4560;
    --radius: 6px;
    --font-mono: 'IBM Plex Mono', monospace;
    --font: 'IBM Plex Sans', sans-serif;
  }

  html, body {
    width: 380px;
    height: 560px;
    overflow: hidden;
    background: transparent;
    font-family: var(--font);
    color: var(--text);
    user-select: none;
    -webkit-app-region: drag;
    transition: height .2s ease;
  }

  body.mini, body.mini html {
    height: 44px;
  }
  body.mini #app {
    border-radius: 8px;
  }
  body.mini #app > *:not(#mini-bar) {
    display: none;
  }
  body.mini #mini-bar {
    display: flex !important;
  }

  /* ── Mini bar ── */
  #mini-bar {
    display: none;
    align-items: center;
    gap: 8px;
    padding: 0 12px;
    height: 42px;
    -webkit-app-region: no-drag;
    cursor: pointer;
    flex-shrink: 0;
  }
  #mini-task-name {
    font-family: var(--font);
    font-size: 12px;
    color: var(--text);
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #mini-task-name.idle { color: var(--muted); }
  #mini-timer {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 600;
    color: var(--warn);
    letter-spacing: .04em;
    flex-shrink: 0;
  }
  #mini-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
    animation: pulse 2s infinite;
  }
  #mini-dot.idle { background: var(--muted); animation: none; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .3; }
  }

  #app {
    width: 100%;
    height: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.04);
    -webkit-app-region: no-drag;
  }

  /* ── Header ── */
  #header {
    padding: 12px 14px 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--line);
    -webkit-app-region: drag;
    flex-shrink: 0;
  }
  #header-title {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: .08em;
    text-transform: uppercase;
    flex: 1;
  }
  #active-clock {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 600;
    color: var(--warn);
    letter-spacing: .04em;
    display: none;
  }
  #active-clock.visible { display: block; }
  .header-btn {
    -webkit-app-region: no-drag;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--muted);
    font-size: 14px;
    padding: 2px 4px;
    border-radius: 4px;
    transition: color .15s;
  }
  .header-btn:hover { color: var(--text); }

  /* ── Quick Add ── */
  #quick-add {
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  #add-row, #add-row2 {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  #add-row2, #add-row3 { margin-top: 6px; }
  #task-input {
    flex: 1;
    background: var(--bg3);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    padding: 7px 10px;
    outline: none;
    transition: border-color .15s;
  }
  #task-input:focus { border-color: var(--accent2); }
  #task-input::placeholder { color: var(--muted); }
  #ticket-input {
    width: 90px;
    background: var(--bg3);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--accent2);
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 7px 8px;
    outline: none;
    transition: border-color .15s;
  }
  #ticket-input:focus { border-color: var(--accent2); }
  #ticket-input::placeholder { color: var(--muted); }
  #project-input:focus { border-color: var(--accent2); }
  #project-input::placeholder { color: var(--muted); }
  .proj-drop-item {
    padding: 5px 8px;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text);
    cursor: pointer;
    line-height: 1.4;
    word-break: break-word;
  }
  .proj-drop-item:hover, .proj-drop-item.selected { background: var(--bg2); color: var(--accent); }
  .proj-drop-sep {
    border-top: 1px solid var(--line);
    margin: 2px 0;
    font-family: var(--font-mono);
    font-size: 8px;
    color: var(--muted);
    padding: 3px 8px 1px;
    text-transform: uppercase;
    letter-spacing: .08em;
  }
  #add-btn {
    background: var(--accent);
    border: none;
    border-radius: var(--radius);
    color: #0f1117;
    font-size: 16px;
    font-weight: 700;
    width: 30px;
    height: 30px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity .15s;
    flex-shrink: 0;
  }
  #add-btn:hover { opacity: .85; }

  /* ── Active task banner ── */
  #active-banner {
    display: none;
    background: linear-gradient(90deg, rgba(245,166,35,.08), transparent);
    border-bottom: 1px solid rgba(245,166,35,.2);
    padding: 7px 14px;
    font-size: 12px;
    color: var(--warn);
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  #active-banner.visible { display: flex; }
  #active-banner-title { flex: 1; font-family: var(--font-mono); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #stop-btn {
    background: rgba(245,166,35,.15);
    border: 1px solid rgba(245,166,35,.3);
    border-radius: 4px;
    color: var(--warn);
    font-size: 11px;
    font-family: var(--font-mono);
    padding: 3px 8px;
    cursor: pointer;
    transition: background .15s;
    white-space: nowrap;
  }
  #stop-btn:hover { background: rgba(245,166,35,.25); }

  /* ── Task list ── */
  #task-list-wrap {
    flex: 1;
    overflow-y: auto;
    padding: 6px 0;
  }
  #task-list-wrap::-webkit-scrollbar { width: 4px; }
  #task-list-wrap::-webkit-scrollbar-track { background: transparent; }
  #task-list-wrap::-webkit-scrollbar-thumb { background: var(--line); border-radius: 2px; }

  .section-label {
    font-family: var(--font-mono);
    font-size: 9px;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 8px 14px 4px;
  }

  .task-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 12px;
    border-radius: 6px;
    margin: 1px 6px;
    cursor: pointer;
    transition: background .1s;
    position: relative;
  }
  .task-item:hover { background: var(--bg2); }
  .task-item.active { background: rgba(245,166,35,.06); }
  .task-item.done { opacity: .4; }

  .task-check {
    width: 16px;
    height: 16px;
    border: 1.5px solid var(--line);
    border-radius: 4px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    transition: all .15s;
    cursor: pointer;
  }
  .task-check:hover { border-color: var(--accent); }
  .task-item.done .task-check { background: var(--accent); border-color: var(--accent); color: #0f1117; }

  .task-body { flex: 1; min-width: 0; }
  .task-title {
    font-size: 13px;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
    white-space: nowrap;
    line-height: 1.3;
  }
  .task-item.done .task-title { color: var(--done-text); text-decoration: line-through; }
  .task-item.active .task-title { color: var(--warn); }

  .task-meta {
    display: flex;
    gap: 6px;
    align-items: center;
    margin-top: 2px;
  }
  .ticket-badge {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--accent2);
    background: rgba(91,156,246,.1);
    border-radius: 3px;
    padding: 0 5px;
    line-height: 16px;
  }
  .task-time {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
  }
  .task-item.active .task-time { color: var(--warn); }

  .task-actions {
    display: none;
    gap: 2px;
    flex-shrink: 0;
  }
  .task-item:hover .task-actions { display: flex; }
  .task-action-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--muted);
    font-size: 13px;
    padding: 2px 4px;
    border-radius: 3px;
    transition: all .1s;
  }
  .task-action-btn:hover { background: var(--bg3); color: var(--text); }
  .task-action-btn.play:hover { color: var(--accent); }
  .task-action-btn.del:hover { color: var(--danger); }

  /* ── Footer ── */
  #footer {
    border-top: 1px solid var(--line);
    padding: 8px 14px;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-shrink: 0;
  }
  #today-summary {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
    flex: 1;
  }
  #today-summary span { color: var(--accent2); }

  /* ── Odoo sync feedback ── */
  #sync-toast {
    position: absolute;
    bottom: 50px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--bg3);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 14px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--accent);
    opacity: 0;
    transition: opacity .3s;
    pointer-events: none;
    white-space: nowrap;
    z-index: 100;
  }
  #sync-toast.show { opacity: 1; }

  #empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.8;
  }
  #empty .emoji { font-size: 28px; display: block; margin-bottom: 8px; }

  /* ── Odoo link badge ── */
  .odoo-badge {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--accent);
    background: rgba(61,214,140,.1);
    border-radius: 3px;
    padding: 0 5px;
    line-height: 16px;
    max-width: 140px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    cursor: pointer;
  }
  .odoo-badge:hover { background: rgba(61,214,140,.2); }
  .unsynced-badge {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--warn);
    background: rgba(245,166,35,.1);
    border-radius: 3px;
    padding: 0 5px;
    line-height: 16px;
  }

  /* ── Odoo search overlay ── */
  #odoo-search-overlay {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(15,17,23,.92);
    z-index: 200;
    flex-direction: column;
    padding: 14px;
  }
  #odoo-search-overlay.visible { display: flex; }

  #odoo-search-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  #odoo-search-header .title {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: .06em;
    text-transform: uppercase;
    flex: 1;
  }
  #odoo-search-close {
    background: none; border: none; cursor: pointer;
    color: var(--muted); font-size: 16px; padding: 2px 6px;
  }
  #odoo-search-close:hover { color: var(--text); }

  #odoo-search-input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    padding: 8px 10px;
    outline: none;
    margin-bottom: 8px;
  }
  #odoo-search-input:focus { border-color: var(--accent); }
  #odoo-search-input::placeholder { color: var(--muted); }

  #odoo-search-status {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
    margin-bottom: 6px;
    min-height: 14px;
  }

  #odoo-search-results {
    flex: 1;
    overflow-y: auto;
    padding-right: 4px;
  }
  #odoo-search-results::-webkit-scrollbar { width: 4px; }
  #odoo-search-results::-webkit-scrollbar-thumb { background: var(--line); border-radius: 2px; }

  .odoo-result-item {
    padding: 8px 10px;
    border-radius: 5px;
    cursor: pointer;
    transition: background .1s;
    margin-bottom: 2px;
  }
  .odoo-result-item:hover, .odoo-result-item.selected { background: var(--bg2); }
  .odoo-result-item.selected { border-left: 2px solid var(--accent); }

  .odoo-result-project {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--accent2);
    margin-bottom: 2px;
  }
  .odoo-result-name {
    font-size: 12px;
    color: var(--text);
    line-height: 1.3;
  }
  .odoo-result-no {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
    margin-left: 6px;
  }

  #odoo-unlink-btn {
    background: rgba(224,92,92,.1);
    border: 1px solid rgba(224,92,92,.2);
    border-radius: 4px;
    color: var(--danger);
    font-family: var(--font-mono);
    font-size: 10px;
    padding: 4px 10px;
    cursor: pointer;
    margin-top: 8px;
    align-self: flex-start;
    display: none;
  }
  #odoo-unlink-btn.visible { display: block; }
  #odoo-unlink-btn:hover { background: rgba(224,92,92,.2); }

  /* ── Project config overlay ── */
  #project-overlay {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(15,17,23,.92);
    z-index: 200;
    flex-direction: column;
    padding: 14px;
  }
  #project-overlay.visible { display: flex; }

  .proj-field { margin-bottom: 8px; }
  .proj-field label {
    display: block;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
    margin-bottom: 3px;
    text-transform: uppercase;
    letter-spacing: .08em;
  }
  .proj-field input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 7px 10px;
    outline: none;
  }
  .proj-field input:focus { border-color: var(--accent2); }
  .proj-field input::placeholder { color: var(--muted); }

  .proj-actions { display: flex; gap: 8px; margin-top: 10px; }
  .proj-actions button {
    background: var(--bg3);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 6px 14px;
    cursor: pointer;
  }
  .proj-actions button:hover { border-color: var(--accent2); }
  .proj-actions button.primary { background: var(--accent); border-color: var(--accent); color: #0f1117; font-weight: 600; }
  .proj-actions button.primary:hover { opacity: .85; }

  .git-badge {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--accent2);
    background: rgba(91,156,246,.1);
    border-radius: 3px;
    padding: 0 5px;
    line-height: 16px;
    cursor: pointer;
  }
  .git-badge:hover { background: rgba(91,156,246,.2); }
  .stage-badge {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--muted);
    background: rgba(90,100,128,.12);
    border-radius: 3px;
    padding: 0 5px;
    line-height: 16px;
  }

  /* ── Team overlay ── */
  #team-overlay {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(15,17,23,.95);
    z-index: 200;
    flex-direction: column;
    padding: 14px;
  }
  #team-overlay.visible { display: flex; }

  .team-employee {
    padding: 8px 10px;
    border-radius: 5px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 2px;
  }
  .team-employee:hover { background: var(--bg2); }
  .team-employee.selected { background: rgba(91,156,246,.1); border-left: 2px solid var(--accent2); }
  .team-employee .name { flex: 1; font-size: 12px; color: var(--text); }
  .team-employee .name.self { color: var(--accent); }
  .team-employee .stats {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
  }

  .team-tasks {
    flex: 1;
    overflow-y: auto;
    border-top: 1px solid var(--line);
    margin-top: 8px;
    padding-top: 8px;
  }
  .team-task-item {
    padding: 5px 8px;
    font-size: 11px;
    color: var(--text);
    border-left: 2px solid var(--line);
    margin-bottom: 3px;
    margin-left: 4px;
    line-height: 1.4;
  }
  .team-task-project { font-family: var(--font-mono); font-size: 9px; color: var(--accent2); }
  .team-task-hours { font-family: var(--font-mono); font-size: 9px; color: var(--muted); margin-left: 6px; }
  .team-task-stage { font-family: var(--font-mono); font-size: 9px; color: var(--muted); background: rgba(90,100,128,.12); border-radius: 3px; padding: 0 4px; margin-left: 4px; }

  .team-summary {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--accent2);
    padding: 6px 0;
  }

  /* ── Edit task overlay ── */
  #edit-overlay {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(15,17,23,.92);
    z-index: 200;
    flex-direction: column;
    padding: 14px;
  }
  #edit-overlay.visible { display: flex; }

  /* ── Commits overlay ── */
  #commits-overlay {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(15,17,23,.95);
    z-index: 200;
    flex-direction: column;
    padding: 14px;
  }
  #commits-overlay.visible { display: flex; }

  #commits-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  #commits-header .title {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    color: var(--accent2);
    letter-spacing: .06em;
    text-transform: uppercase;
    flex: 1;
  }
  #commits-close {
    background: none; border: none; cursor: pointer;
    color: var(--muted); font-size: 16px; padding: 2px 6px;
  }
  #commits-close:hover { color: var(--text); }

  #commits-status {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
    margin-bottom: 6px;
  }

  #commits-list {
    flex: 1;
    overflow-y: auto;
    padding-right: 4px;
  }
  #commits-list::-webkit-scrollbar { width: 4px; }
  #commits-list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 2px; }

  .commit-item {
    padding: 6px 8px;
    border-left: 2px solid var(--line);
    margin-bottom: 4px;
    margin-left: 4px;
  }
  .commit-item.new-commit { border-left-color: var(--accent); }
  .commit-msg {
    font-size: 12px;
    color: var(--text);
    line-height: 1.3;
    word-break: break-word;
  }
  .commit-meta {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
    margin-top: 2px;
    display: flex;
    gap: 8px;
  }
  .commit-sha { color: var(--accent2); }

  #commits-copy-btn {
    margin-top: 8px;
    align-self: flex-start;
    background: var(--bg3);
    border: 1px solid var(--line);
    border-radius: 4px;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 10px;
    padding: 4px 10px;
    cursor: pointer;
  }
  #commits-copy-btn:hover { border-color: var(--accent2); }

  /* ── Filter bar ── */
  #filter-bar {
    display: flex;
    gap: 6px;
    padding: 4px 14px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  .filter-btn {
    -webkit-app-region: no-drag;
    background: none;
    border: 1px solid var(--line);
    border-radius: 4px;
    cursor: pointer;
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 9px;
    padding: 2px 6px;
    transition: all .15s;
  }
  .filter-btn:hover { border-color: var(--accent2); color: var(--text); }
  .filter-btn.active { background: rgba(245,166,35,.15); border-color: var(--warn); color: var(--warn); }

  /* ── Merge mode ── */
  .task-item.merge-source { outline: 2px solid var(--accent); outline-offset: -2px; }
  .task-item.merge-target:hover { outline: 2px dashed var(--accent2); outline-offset: -2px; }
</style>
</head>
<body>

  </div>

  <div id="odoo-search-status"></div>
  <div id="odoo-search-results"></div>
  <button id="odoo-unlink-btn">Verknüpfung lösen</button>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let tasks = [];
let activeTaskId = null;
let activeSlotId = null;
let tickStart = null; // Date.now() when active slot started (approximate)
let elapsedBase = 0;  // seconds already counted before this slot
let filterUnlinked = false;
let filterPending = false;
let mergeSourceId = null;
let searchQuery = '';

// ── Helpers ────────────────────────────────────────────────────────────────
function fmtSeconds(s) {
  s = Math.max(0, Math.round(s));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const ss = s % 60;
  if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
  return `${m}:${String(ss).padStart(2,'0')}`;
}

function showToast(msg, color = '#3dd68c') {
  const t = document.getElementById('sync-toast');
  t.textContent = msg;
  t.style.color = color;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ── Render ─────────────────────────────────────────────────────────────────
function renderTasks() {
  const list = document.getElementById('task-list');
  let filtered = tasks;
  if (filterUnlinked) filtered = filtered.filter(t => !t.odoo_task_id);
  if (filterPending) filtered = filtered.filter(t => t.unsynced_count > 0);
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    filtered = filtered.filter(t =>
      (t.title || '').toLowerCase().includes(q) ||
      (t.ticket_ref || '').toLowerCase().includes(q) ||
      (t.odoo_task_label || '').toLowerCase().includes(q) ||
      (t.odoo_stage || '').toLowerCase().includes(q) ||
      (t.git_branch || '').toLowerCase().includes(q) ||
      (t.note || '').toLowerCase().includes(q)
    );
  }
  const active = filtered.filter(t => !t.done);
  const done = filtered.filter(t => t.done);

  if (filtered.length === 0) {
    list.innerHTML = `<div id="empty"><span class="emoji">🌅</span>${filterUnlinked ? 'Alle Tasks sind verknüpft.' : filterPending ? 'Keine ausstehenden Uploads.' : 'Noch keine Aufgaben heute.<br>Einfach oben eintippen.'}</div>`;
    return;
  }

  let html = '';

  if (active.length > 0) {
    html += `<div class="section-label">Offen (${active.length})</div>`;
    for (const t of active) html += taskHTML(t);
  }
  if (done.length > 0) {
    html += `<div class="section-label">Erledigt (${done.length})</div>`;
    for (const t of done) html += taskHTML(t);
  }

  list.innerHTML = html;

  // Update footer
  const totalSec = tasks.reduce((s, t) => s + (t.total_seconds || 0), 0);
  const extraSec = (activeTaskId && tickStart) ? (Date.now() - tickStart) / 1000 : 0;
  document.getElementById('total-time').textContent = fmtSeconds(totalSec + extraSec);
  document.getElementById('done-count').textContent = done.length;
  const unsyncedSec = tasks.reduce((s, t) => s + (t.unsynced_seconds || 0), 0);
  const unsyncedEl = document.getElementById('unsynced-time');
  unsyncedEl.textContent = unsyncedSec > 0 ? `${fmtSeconds(unsyncedSec)} offen` : '';

  // Active banner
  const activeTask = tasks.find(t => t.id === activeTaskId);
  const banner = document.getElementById('active-banner');
  if (activeTask) {
    banner.classList.add('visible');
    document.getElementById('active-banner-title').textContent = activeTask.title;
  } else {
    banner.classList.remove('visible');
  }
}

function taskHTML(t) {
  const isActive = t.id === activeTaskId;
  const isMergeSource = t.id === mergeSourceId;
  const cls = [isActive ? 'active' : '', t.done ? 'done' : '', isMergeSource ? 'merge-source' : '', mergeSourceId && !isMergeSource ? 'merge-target' : ''].filter(Boolean).join(' ');
  const check = t.done ? '✓' : '';

  let secs = t.total_seconds || 0;
  if (isActive && tickStart) secs += (Date.now() - tickStart) / 1000;
  const timeStr = secs > 30 ? fmtSeconds(secs) : '';

  // Deadline display
  let deadlineStr = '';
  if (t.deadline) {
    const now = new Date(); now.setHours(0,0,0,0);
    const dl = new Date(t.deadline); dl.setHours(0,0,0,0);
    const days = Math.round((dl - now) / 86400000);
    if (days < 0) deadlineStr = `<span class="task-time" style="color:var(--danger)">${Math.abs(days)}d überfällig</span>`;
    else if (days === 0) deadlineStr = `<span class="task-time" style="color:var(--danger)">heute fällig</span>`;
    else if (days <= 3) deadlineStr = `<span class="task-time" style="color:var(--warn)">${days}d</span>`;
    else deadlineStr = `<span class="task-time">${days}d</span>`;
  }

  return `
  <div class="task-item ${cls}" data-id="${t.id}">
    <div class="task-check" data-check="${t.id}">${check}</div>
    <div class="task-body">
      <div class="task-title"><span style="color:var(--muted);font-family:var(--font-mono);font-size:10px;margin-right:4px">${escapeHtml(t.sequence_name || '#'+t.id)}</span>${escapeHtml(t.title)}</div>
      <div class="task-meta">
        ${t.ticket_ref ? `<span class="ticket-badge">${escapeHtml(t.ticket_ref)}</span>` : ''}
        ${t.odoo_task_label ? `<span class="odoo-badge" data-odoo-open="${t.odoo_task_id}" data-odoo-link="${t.id}" title="Odoo: ${escapeHtml(t.odoo_task_label)} (Klick=öffnen, Lang=ändern)">${escapeHtml(t.odoo_task_label)}</span>` : ''}
        ${t.odoo_stage ? `<span class="stage-badge">${escapeHtml(t.odoo_stage)}</span>` : ''}
        ${t.git_branch ? `<span class="git-badge" data-proj="${t.id}" title="${escapeHtml(t.git_branch)}">${escapeHtml(t.git_branch)}</span>` : ''}
        ${t.unsynced_count > 0 ? `<span class="unsynced-badge" title="${t.unsynced_count} Timeslot(s) nicht hochgeladen${!t.odoo_task_id ? ' – Odoo Task verknüpfen' : ''}">${t.unsynced_count}× pending</span>` : ''}
        ${deadlineStr}
        ${timeStr ? `<span class="task-time">${timeStr}</span>` : ''}
      </div>
    </div>
    <div class="task-actions">
      ${!t.done ? `<button class="task-action-btn play" data-play="${t.id}" title="${isActive ? 'Läuft…' : 'Starten'}">${isActive ? '⏸' : '▶'}</button>` : ''}
      ${t.vscode_path ? `<button class="task-action-btn" data-open-vscode="${t.id}" title="In VSCode öffnen" style="font-size:11px;line-height:1"><svg width="14" height="14" viewBox="0 0 100 100" fill="none"><path d="M74.5 97.6L24.9 73.2l49.6-24.4v48.8z" fill="#0078d4"/><path d="M24.9 73.2L2.4 55.6 24.9 38V73.2z" fill="#0078d4" opacity=".8"/><path d="M74.5 48.8L37.3 73.2 2.4 55.6l35-24.4 37.1 17.6z" fill="#0078d4" opacity=".6"/><path d="M74.5 2.4v46.4L37.3 73.2 2.4 55.6 37.3 31.2 74.5 2.4z" fill="#0078d4" opacity=".4"/></svg></button>` : ''}
      ${t.ticket_url ? `<button class="task-action-btn" data-open-ticket="${t.id}" title="Ticket öffnen" style="font-size:11px">🎫</button>` : ''}
      ${t.vscode_path ? `<button class="task-action-btn" data-commits="${t.id}" title="Git Commits" style="font-size:11px">📋</button>` : ''}
      <button class="task-action-btn" data-proj="${t.id}" title="Projekt/VSCode" style="font-size:11px">⚙</button>
      <button class="task-action-btn" data-link="${t.id}" title="Odoo Task verknüpfen" style="font-size:11px">🔗</button>
      <button class="task-action-btn" data-merge="${t.id}" title="Zusammenführen" style="font-size:11px">⊕</button>
      <button class="task-action-btn del" data-del="${t.id}" title="Löschen">🗑</button>
    </div>
  </div>`;
}

function escapeHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Data loading ───────────────────────────────────────────────────────────
async function load() {
  try {
  console.log('[load] Aufgerufen');
  const res = await window.dt.todayTasks();
  console.log('[load] Tasks erhalten:', res.tasks?.length);
  tasks = res.tasks;
  activeTaskId = res.activeTaskId;
  activeSlotId = res.activeSlotId;

  // Merge in unsynced tasks from previous days
  const unsyncedRes = await window.dt.unsyncedTasks();
  const todayIds = new Set(tasks.map(t => t.id));
  for (const t of unsyncedRes.tasks) {
    if (!todayIds.has(t.id)) tasks.push(t);
  }

  // estimate tick start from running_since
  const activeTask = tasks.find(t => t.id === activeTaskId);
  if (activeTask && activeTask.running_since) {
    const started = new Date(activeTask.running_since.replace(' ', 'T'));
    const runningMs = Date.now() - started.getTime();
    tickStart = Date.now() - runningMs;
    // total_seconds from DB already includes running time via COALESCE —
    // subtract it so tick delta can be cleanly added back in render/onTick
    activeTask.total_seconds = (activeTask.total_seconds || 0) - runningMs / 1000;
    elapsedBase = activeTask.total_seconds;
  } else {
    tickStart = null;
    elapsedBase = 0;
  }

  renderTasks();
  updateClock();
  if (typeof updateFilterLabel === 'function') updateFilterLabel();
  } catch(e) { console.error('[load] FEHLER:', e); document.title = 'ERR: ' + e.message; }
}

// ── Clock ──────────────────────────────────────────────────────────────────
function updateClock() {
  const clock = document.getElementById('active-clock');
  if (activeTaskId && tickStart) {
    const secs = (Date.now() - tickStart) / 1000;
    clock.textContent = fmtSeconds(secs);
    clock.classList.add('visible');
  } else {
    clock.classList.remove('visible');
  }
  updateMiniBar();
}

function updateMiniBar() {
  const dot = document.getElementById('mini-dot');
  const name = document.getElementById('mini-task-name');
  const timer = document.getElementById('mini-timer');
  if (activeTaskId && tickStart) {
    const task = tasks.find(t => t.id === activeTaskId);
    dot.classList.remove('idle');
    name.classList.remove('idle');
    name.textContent = task ? task.title : 'Task…';
    const totalSecs = (task?.total_seconds || 0) + (Date.now() - tickStart) / 1000;
    timer.textContent = fmtSeconds(totalSecs);
  } else {
    dot.classList.add('idle');
    name.classList.add('idle');
    name.textContent = 'Kein aktiver Task';
    timer.textContent = '';
  }
}

window.dt.onTick(({ now }) => {
  if (!activeTaskId || !tickStart) return;
  // update clock
  updateClock();
  // update task time in-place without full re-render
  const item = document.querySelector(`.task-item.active`);
  if (item) {
    const secs = (activeTaskId ? (tasks.find(t=>t.id===activeTaskId)?.total_seconds||0) : 0)
               + (tickStart ? (now - tickStart)/1000 : 0);
    const timeEl = item.querySelector('.task-time');
    if (timeEl) timeEl.textContent = fmtSeconds(secs);
    else {
      const meta = item.querySelector('.task-meta');
      if (meta) {
        const s = document.createElement('span');
        s.className = 'task-time';
        s.textContent = fmtSeconds(secs);
        meta.appendChild(s);
      }
    }
  }
  // footer
  const totalSec = tasks.reduce((s, t) => s + (t.total_seconds || 0), 0);
  const extra = tickStart ? (now - tickStart) / 1000 : 0;
  document.getElementById('total-time').textContent = fmtSeconds(totalSec + extra);
});

document.getElementById('task-list').addEventListener('click', async (e) => {
  const checkEl = e.target.closest('[data-check]');
  const playEl = e.target.closest('[data-play]');
  const delEl = e.target.closest('[data-del]');
  const itemEl = e.target.closest('.task-item');

  if (checkEl) {
    const id = +checkEl.dataset.check;
    const task = tasks.find(t => t.id === id);
    if (task.done) { await window.dt.undoneTask(id); }
    else { await window.dt.doneTask(id); }
    await load();
    return;
  }

  if (playEl) {
    const id = +playEl.dataset.play;
    if (id === activeTaskId) {
      const res = await window.dt.stopTimer();
      tickStart = null;
      if (res.odoo?.ok) showToast('✓ Odoo sync: ' + (res.odoo.lineId || 'ok'));
      else if (res.odoo?.error && res.odoo.error !== 'Odoo not configured') showToast('Odoo: ' + res.odoo.error, '#e05c5c');
    } else {
      const res = await window.dt.startTimer(id);
      if (res.ok) { tickStart = Date.now(); }
    }
    await load();
    return;
  }

  if (delEl) {
    const id = +delEl.dataset.del;
    if (confirm('Task löschen?')) {
      await window.dt.deleteTask(id);
      await load();
    }
    return;
  }
});

document.getElementById('stop-btn').addEventListener('click', async () => {
  const res = await window.dt.stopTimer();
  tickStart = null;
  if (res.odoo?.ok) showToast('✓ Odoo sync: ' + (res.odoo.lineId || 'ok'));
  else if (res.odoo?.error && res.odoo.error !== 'Odoo not configured') showToast('Odoo: ' + res.odoo.error, '#e05c5c');
  await load();
});

let selectedProject = null; // { id, name }
let projDropIdx = -1;
let projDropItems = [];

async function showProjectDropdown(query) {
  const dd = document.getElementById('project-dropdown');
  let html = '';

  // Recent projects
  const recent = await window.dt.recentProjects();
  const filtered = query
    ? recent.filter(p => p.name.toLowerCase().includes(query.toLowerCase()))
    : recent;

  if (filtered.length > 0) {
    html += '<div class="proj-drop-sep">Letzte</div>';
    for (const p of filtered) {
      html += `<div class="proj-drop-item" data-pid="${p.id}" data-pname="${escapeHtml(p.name)}">${escapeHtml(p.name)}</div>`;
    }
  }

  // Odoo search if query is >= 2 chars
  if (query && query.length >= 2) {
    const odooResults = await window.dt.searchProjects(query);
    const recentIds = new Set(filtered.map(p => p.id));
    const extra = odooResults.filter(p => !recentIds.has(p.id));
    if (extra.length > 0) {
      html += '<div class="proj-drop-sep">Odoo</div>';
      for (const p of extra) {
        html += `<div class="proj-drop-item" data-pid="${p.id}" data-pname="${escapeHtml(p.name)}">${escapeHtml(p.name)}</div>`;
      }
    }
  }

  if (!html) html = '<div class="proj-drop-item" style="color:var(--muted)">Keine Projekte</div>';
  dd.innerHTML = html;
  dd.style.display = 'block';
  projDropItems = [...dd.querySelectorAll('[data-pid]')];
  projDropIdx = -1;
}

function hideProjectDropdown() {
  document.getElementById('project-dropdown').style.display = 'none';
}

let selectedOdooTask = null; // { id, name, sequence_name }

function selectProjectItem(el) {
  if (!el) return;

  document.getElementById('project-input').style.color = 'var(--accent)';

function getSelectedProject() {

    result.odoo_task_name = selectedOdooTask.name;
    result.odoo_task_sequence = selectedOdooTask.sequence_name;

}

let odooSelectedIdx = -1;

  linkingTaskId = taskId;
  odooResults = [];
  odooSelectedIdx = -1;

  overlay.classList.add('visible');

function renderOdooResults() {
  const container = document.getElementById('odoo-search-results');
  const query = document.getElementById('odoo-search-input').value.trim();
  let html = odooResults.map((t, i) => `
    <div class="odoo-result-item ${i === odooSelectedIdx ? 'selected' : ''}" data-odoo-idx="${i}">
      <div class="odoo-result-project">${escapeHtml(t.project_name)}${t.no ? `<span class="odoo-result-no">#${escapeHtml(t.no)}</span>` : ''}</div>

    html = '<div style="color:var(--muted);font-size:12px;padding:12px;text-align:center">Keine Ergebnisse</div>';
  }
  // "Create new" section
  if (query.length >= 2) {
    html += `<div id="odoo-create-section" style="border-top:1px solid var(--line);padding:8px 12px">
      <div style="font-size:10px;color:var(--muted);margin-bottom:6px">Task in Odoo erstellen:</div>
      <div style="display:flex;gap:6px;align-items:center">
        <input type="text" id="odoo-create-project" placeholder="Projekt suchen…" autocomplete="off" style="flex:1;background:var(--bg3);border:1px solid var(--line);border-radius:5px;color:var(--text);font-family:var(--font-mono);font-size:11px;padding:5px 8px;outline:none">
        <button id="odoo-create-btn" style="background:var(--accent);border:none;border-radius:5px;color:#0f1117;font-family:var(--font-mono);font-size:10px;font-weight:600;padding:6px 10px;cursor:pointer;white-space:nowrap">+ Erstellen</button>
      </div>
      <div id="odoo-create-dropdown" style="display:none;max-height:120px;overflow-y:auto;border:1px solid var(--line);border-radius:0 0 5px 5px;background:var(--bg)"></div>
    </div>`;
  }
  container.innerHTML = html;
  // Wire up create section
  const projInput = document.getElementById('odoo-create-project');
  if (projInput) {
    let createProjId = null;
    let createTimer = null;
    projInput.addEventListener('input', () => {
      clearTimeout(createTimer);
      createProjId = null;
      createTimer = setTimeout(async () => {
        const q = projInput.value.trim();
        if (!q) { document.getElementById('odoo-create-dropdown').style.display = 'none'; return; }
        const projects = await window.dt.searchProjects(q);
        const dd = document.getElementById('odoo-create-dropdown');
        if (!projects.length) { dd.style.display = 'none'; return; }
        dd.innerHTML = projects.map(p => `<div class="proj-drop-item" data-pid="${p.id}">${escapeHtml(p.name)}</div>`).join('');
        dd.style.display = 'block';
        dd.querySelectorAll('.proj-drop-item').forEach(el => {
          el.style.cssText = 'padding:6px 10px;cursor:pointer;font-family:var(--font-mono);font-size:11px;color:var(--text)';
          el.addEventListener('mouseenter', () => el.style.background = 'var(--bg3)');
          el.addEventListener('mouseleave', () => el.style.background = '');
          el.addEventListener('mousedown', (e) => {
            e.preventDefault();
            createProjId = +el.dataset.pid;
            projInput.value = el.textContent;
            projInput.style.color = 'var(--accent2)';
            dd.style.display = 'none';
          });
        });
      }, 300);
    });
    document.getElementById('odoo-create-btn').addEventListener('click', async () => {
      if (!createProjId) { showToast('Erst Projekt auswählen', '#e05c5c'); return; }
      const btn = document.getElementById('odoo-create-btn');
      btn.disabled = true;
      btn.textContent = 'Erstelle…';
      const res = await window.dt.createOdooTask({ projectId: createProjId, name: query });
      if (res.ok) {
        const label = `${projInput.value} / ${query}`;
        const linkRes = await window.dt.linkOdooTask({
          taskId: linkingTaskId,
          odooTaskId: res.taskId,
          odooProjectId: createProjId,
          odooTaskLabel: label,
        });

        showToast('Odoo Task erstellt + verknüpft');

      } else {
        showToast('Fehler: ' + res.error, '#e05c5c');
        btn.disabled = false;
        btn.textContent = '+ Erstellen';
      }
    });
  }
}

async function doOdooSearch(query) {
  const status = document.getElementById('odoo-search-status');
  if (!query || query.length < 2) {
    status.textContent = 'Mindestens 2 Zeichen…';
    odooResults = [];
    renderOdooResults();
    return;
  }
  status.textContent = 'Suche…';
  const res = await window.dt.odooSearchTasks(query);
  if (!res.ok) {
    status.textContent = 'Fehler: ' + res.error;
    odooResults = [];
  } else {
    odooResults = res.tasks;
    odooSelectedIdx = odooResults.length > 0 ? 0 : -1;
    status.textContent = `${odooResults.length} Ergebnis${odooResults.length !== 1 ? 'se' : ''}`;
  }
  renderOdooResults();
}

async function selectOdooResult(idx) {
  const t = odooResults[idx];
  if (!t || !linkingTaskId) return;
  const label = `${t.project_name} / ${t.name}${t.no ? ' #' + t.no : ''}`;
  const res = await window.dt.linkOdooTask({
    taskId: linkingTaskId,
    odooTaskId: t.id,
    odooProjectId: t.project_id,
    odooTaskLabel: label,
    gitBranch: t.branch_name || '',
    gitRepo: t.repo || '',
    deadline: t.date_deadline || '',
  });
  closeOdooSearch();
  if (res.synced > 0) {
    showToast(`Verknüpft + ${res.synced} Zeitslot${res.synced > 1 ? 's' : ''} nachgebucht`);
  } else {
    showToast('Odoo Task verknüpft');
  }
  if (res.failed > 0) {
    showToast(`${res.failed} Slot${res.failed > 1 ? 's' : ''} fehlgeschlagen`, '#e05c5c');
  }
  await load();
}

document.getElementById('odoo-search-input').addEventListener('input', (e) => {
  clearTimeout(odooSearchTimer);
  odooSearchTimer = setTimeout(() => doOdooSearch(e.target.value.trim()), 300);
});

document.getElementById('odoo-search-input').addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeOdooSearch(); return; }
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (odooSelectedIdx < odooResults.length - 1) { odooSelectedIdx++; renderOdooResults(); }
    return;
  }
  if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (odooSelectedIdx > 0) { odooSelectedIdx--; renderOdooResults(); }
    return;
  }
  if (e.key === 'Enter' && odooSelectedIdx >= 0) {
    e.preventDefault();
    selectOdooResult(odooSelectedIdx);
  }
});

document.getElementById('odoo-search-results').addEventListener('click', (e) => {

// Handle link button + odoo badge + project clicks in task list (capturing phase)
document.getElementById('task-list').addEventListener('click', (e) => {
  const linkEl = e.target.closest('[data-link]');
  if (linkEl) { e.stopPropagation(); openOdooSearch(+linkEl.dataset.link); return; }
  const odooBadge = e.target.closest('[data-odoo-open]');
  if (odooBadge) {
    e.stopPropagation();
    // Open Odoo task in browser
    window.dt.openOdooTask(+odooBadge.dataset.odooOpen);
    return;
  }
  const projEl = e.target.closest('[data-proj]');
  if (projEl) { e.stopPropagation(); openProjectOverlay(+projEl.dataset.proj); return; }
  const vsEl = e.target.closest('[data-open-vscode]');
  if (vsEl) {
    e.stopPropagation();
    window.dt.openVscode(+vsEl.dataset.openVscode).then(r => {
      if (r.branchMsg) showToast(r.branchMsg, r.branchMsg.includes('fehl') || r.branchMsg.includes('dirty') ? '#f5a623' : '#3dd68c');
    });
    return;
  }
  const ticketEl = e.target.closest('[data-open-ticket]');
  if (ticketEl) { e.stopPropagation(); window.dt.openTicket(+ticketEl.dataset.openTicket); return; }
  const editEl = e.target.closest('[data-edit]');
  if (editEl) { e.stopPropagation(); openEditOverlay(+editEl.dataset.edit); return; }
  const titleEl = e.target.closest('.task-title');
  if (titleEl) { const item = titleEl.closest('.task-item[data-id]'); if (item) { e.stopPropagation(); openEditOverlay(+item.dataset.id); return; } }
  const commitsEl = e.target.closest('[data-commits]');
  if (commitsEl) { e.stopPropagation(); openCommitsOverlay(+commitsEl.dataset.commits); return; }
  const mergeEl = e.target.closest('[data-merge]');
  if (mergeEl) { e.stopPropagation(); startMerge(+mergeEl.dataset.merge); return; }
  // If in merge mode, clicking a task item is the merge target
  if (mergeSourceId) {
    const itemEl = e.target.closest('.task-item[data-id]');
    if (itemEl) { e.stopPropagation(); doMerge(+itemEl.dataset.id); return; }
  }
}, true);

// ── Project / VSCode overlay ─────────────────────────────────────────────
let projectTaskId = null;

function openProjectOverlay(taskId) {
  projectTaskId = taskId;
  const task = tasks.find(t => t.id === taskId);
  document.getElementById('proj-ssh').value = task?.vscode_ssh_host || '';
  document.getElementById('proj-path').value = task?.vscode_path || '';
  document.getElementById('proj-repo').value = task?.git_repo || '';
  document.getElementById('proj-branch').value = task?.git_branch || '';
  document.getElementById('proj-ticket-url').value = task?.ticket_url || '';
  document.getElementById('project-overlay').classList.add('visible');
  setTimeout(() => document.getElementById('proj-path').focus(), 50);
}

function closeProjectOverlay() {
  projectTaskId = null;
  document.getElementById('project-overlay').classList.remove('visible');
}

document.getElementById('project-close').addEventListener('click', closeProjectOverlay);

document.getElementById('proj-save').addEventListener('click', async () => {
  if (!projectTaskId) return;
  await window.dt.saveVscode({
    taskId: projectTaskId,
    vscode_ssh_host: document.getElementById('proj-ssh').value.trim(),
    vscode_path: document.getElementById('proj-path').value.trim(),
    git_repo: document.getElementById('proj-repo').value.trim(),
    git_branch: document.getElementById('proj-branch').value.trim(),
    ticket_url: document.getElementById('proj-ticket-url').value.trim(),
  });
  closeProjectOverlay();
  showToast('Projekt gespeichert');
  await load();
});

document.getElementById('proj-open-vscode').addEventListener('click', async () => {
  if (!projectTaskId) return;
  // Save first
  await window.dt.saveVscode({
    taskId: projectTaskId,
    vscode_ssh_host: document.getElementById('proj-ssh').value.trim(),
    vscode_path: document.getElementById('proj-path').value.trim(),
    git_repo: document.getElementById('proj-repo').value.trim(),
    git_branch: document.getElementById('proj-branch').value.trim(),
    ticket_url: document.getElementById('proj-ticket-url').value.trim(),
  });
  await window.dt.openVscode(projectTaskId);
  closeProjectOverlay();
  await load();
});

// Escape closes project overlay
document.getElementById('project-overlay').addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeProjectOverlay();
});

// ── Team overlay ─────────────────────────────────────────────────────────
let teamEmployees = [];
let selectedEmployeeId = null;

async function openTeamOverlay() {
  document.getElementById('team-overlay').classList.add('visible');
  document.getElementById('team-list').innerHTML = '<div style="color:var(--muted);font-size:11px;padding:8px">Lade Mitarbeiter…</div>';
  document.getElementById('team-tasks').innerHTML = '';
  document.getElementById('team-summary').textContent = '';

  teamEmployees = await window.dt.getEmployees();
  // Sort: self first, then alphabetical
  teamEmployees.sort((a, b) => (b.isSelf ? 1 : 0) - (a.isSelf ? 1 : 0) || a.name.localeCompare(b.name));

  renderTeamList();
  // Auto-select self
  const self = teamEmployees.find(e => e.isSelf);
  if (self) loadEmployeeTasks(self.id);
}

function renderTeamList() {
  document.getElementById('team-list').innerHTML = teamEmployees.map(e =>
    `<div class="team-employee ${e.id === selectedEmployeeId ? 'selected' : ''}" data-eid="${e.id}">
      <span class="name ${e.isSelf ? 'self' : ''}">${escapeHtml(e.name)}${e.isSelf ? ' (ich)' : ''}</span>
    </div>`
  ).join('');
}

async function loadEmployeeTasks(userId) {
  selectedEmployeeId = userId;
  renderTeamList();
  document.getElementById('team-tasks').innerHTML = '<div style="color:var(--muted);font-size:11px;padding:8px">Lade Tasks…</div>';
  document.getElementById('team-summary').textContent = '';

  const res = await window.dt.getEmployeeTasks(userId);

  const summ = `${res.taskCount} Tasks`;
  const hours = res.totalAllocated > 0
    ? ` · ${Math.round(res.totalEffective)}h / ${Math.round(res.totalAllocated)}h (${Math.round(res.totalEffective / res.totalAllocated * 100)}%)`
    : res.totalEffective > 0 ? ` · ${Math.round(res.totalEffective)}h gebucht` : '';
  document.getElementById('team-summary').textContent = summ + hours;

  if (res.tasks.length === 0) {
    document.getElementById('team-tasks').innerHTML = '<div style="color:var(--muted);font-size:11px;padding:8px">Keine Tasks</div>';
    return;
  }

  document.getElementById('team-tasks').innerHTML = res.tasks.map(t => {
    const hrs = t.allocated > 0
      ? `<span class="team-task-hours">${Math.round(t.effective * 10) / 10}/${Math.round(t.allocated * 10) / 10}h</span>`
      : t.effective > 0 ? `<span class="team-task-hours">${Math.round(t.effective * 10) / 10}h</span>` : '';
    return `<div class="team-task-item">
      <span class="team-task-project">${escapeHtml(t.project)}</span>
      ${t.stage ? `<span class="team-task-stage">${escapeHtml(t.stage)}</span>` : ''}
      ${hrs}
      <div>${escapeHtml(t.sequence_name ? t.sequence_name + ' ' : '')}${escapeHtml(t.name)}</div>
    </div>`;
  }).join('');
}

function closeTeamOverlay() {
  selectedEmployeeId = null;
  document.getElementById('team-overlay').classList.remove('visible');
}

document.getElementById('team-btn').addEventListener('click', openTeamOverlay);
document.getElementById('team-close').addEventListener('click', closeTeamOverlay);
document.getElementById('team-overlay').addEventListener('keydown', (e) => { if (e.key === 'Escape') closeTeamOverlay(); });
document.getElementById('team-list').addEventListener('click', (e) => {
  const el = e.target.closest('[data-eid]');
  if (el) loadEmployeeTasks(+el.dataset.eid);
});

// ── Edit task overlay ────────────────────────────────────────────────────
let editTaskId = null;

async function openEditOverlay(taskId) {
  editTaskId = taskId;
  const task = await window.dt.getTask(taskId);
  const taskData = tasks.find(t => t.id === taskId);
  let totalSec = taskData?.total_seconds || 0;
  if (taskData?.id === activeTaskId && tickStart) totalSec += (Date.now() - tickStart) / 1000;
  document.getElementById('edit-total-time').textContent = totalSec > 0 ? 'Gesamtzeit: ' + fmtSeconds(totalSec) : '';

  // Odoo link
  const odooLinkEl = document.getElementById('edit-odoo-link');
  const odooAnchor = document.getElementById('edit-odoo-anchor');
  if (taskData?.odoo_task_id) {
    odooAnchor.textContent = taskData.odoo_task_label || `Odoo Task #${taskData.odoo_task_id}`;
    odooAnchor.onclick = (e) => { e.preventDefault(); window.dt.openOdooTask(taskData.odoo_task_id); };
    odooLinkEl.style.display = '';
  } else {
    odooLinkEl.style.display = 'none';
  }

  const uploadBtn = document.getElementById('edit-upload');
  uploadBtn.disabled = false;
  const unsyncedCount = taskData?.unsynced_count || 0;
  if (unsyncedCount > 0 && taskData?.odoo_task_id) {
    const unsyncedSec = taskData?.unsynced_seconds || 0;
    uploadBtn.textContent = `Hochladen (${unsyncedCount} Slot${unsyncedCount > 1 ? 's' : ''}, ${fmtSeconds(unsyncedSec)})`;
    uploadBtn.style.display = '';
  } else if (unsyncedCount > 0) {
    uploadBtn.textContent = 'Erst Odoo-Task verknüpfen';
    uploadBtn.style.display = '';
    uploadBtn.disabled = true;
  } else {
    uploadBtn.style.display = 'none';
  }

  document.getElementById('edit-title').value = task?.title || '';
  document.getElementById('edit-ticket').value = task?.ticket_ref || '';
  document.getElementById('edit-git-repo').value = task?.git_repo || '';
  document.getElementById('edit-git-branch').value = task?.git_branch || '';
  document.getElementById('edit-note').value = task?.note || '';
  document.getElementById('edit-slot-hours').value = '';
  document.getElementById('edit-slot-minutes').value = '';
  document.getElementById('edit-overlay').classList.add('visible');
  setTimeout(() => document.getElementById('edit-title').focus(), 50);
}

function closeEditOverlay() {
  editTaskId = null;
  document.getElementById('edit-overlay').classList.remove('visible');
}

document.getElementById('edit-close').addEventListener('click', closeEditOverlay);
document.getElementById('edit-overlay').addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeEditOverlay();
});

document.getElementById('edit-save').addEventListener('click', async () => {
  if (!editTaskId) return;
  await window.dt.updateTask({
    id: editTaskId,
    title: document.getElementById('edit-title').value.trim(),
    ticket_ref: document.getElementById('edit-ticket').value.trim(),
    note: document.getElementById('edit-note').value.trim(),
  });
  closeEditOverlay();
  showToast('Task aktualisiert');
  await load();
});

// Fetch commits into note
document.getElementById('edit-reset-time').addEventListener('click', async () => {
  if (!editTaskId) return;
  await window.dt.resetTimeslots(editTaskId);
  showToast('Zeiterfassung zurückgesetzt');
  await load();
});

document.getElementById('edit-upload').addEventListener('click', async () => {
  if (!editTaskId) return;
  const btn = document.getElementById('edit-upload');
  btn.disabled = true;
  btn.textContent = 'Wird hochgeladen…';
  const res = await window.dt.syncUnsynced(editTaskId);
  if (res.ok) {
    showToast(`${res.synced} Slot${res.synced > 1 ? 's' : ''} hochgeladen`);
  } else {
    showToast(`${res.synced} OK, ${res.failed} fehlgeschlagen: ${res.errors.join(', ')}`, '#e05c5c');
  }
  btn.disabled = false;
  await load();
  await openEditOverlay(editTaskId);
});

document.getElementById('edit-fetch-commits').addEventListener('click', async () => {
  if (!editTaskId) return;
  const res = await window.dt.fetchCommits(editTaskId);
  if (!res.ok) { showToast('Fehler: ' + res.error, '#e05c5c'); return; }
  if (res.commits.length === 0) { showToast('Keine neuen Commits'); return; }
  const text = res.commits.map(c => `${c.short} ${c.message}`).join('\n');
  const note = document.getElementById('edit-note');
  note.value = note.value ? note.value + '\n\n' + text : text;
  showToast(`${res.commits.length} Commit${res.commits.length > 1 ? 's' : ''} eingefügt`);
});

// Add manual timeslot by duration
document.getElementById('edit-add-slot').addEventListener('click', async () => {
  if (!editTaskId) return;
  const h = parseInt(document.getElementById('edit-slot-hours').value) || 0;
  const m = parseInt(document.getElementById('edit-slot-minutes').value) || 0;
  if (h === 0 && m === 0) { showToast('Dauer angeben', '#e05c5c'); return; }
  await window.dt.addTimeslot({ taskId: editTaskId, durationMinutes: h * 60 + m });
  document.getElementById('edit-slot-hours').value = '';
  document.getElementById('edit-slot-minutes').value = '';
  showToast(`${h}h ${m}min eingetragen`);
  await load();
});

// ── Git Commits overlay ──────────────────────────────────────────────────
let commitsTaskId = null;
let lastCommits = [];

async function openCommitsOverlay(taskId) {
  commitsTaskId = taskId;
  const overlay = document.getElementById('commits-overlay');
  overlay.classList.add('visible');
  document.getElementById('commits-status').textContent = 'Lade Commits…';
  document.getElementById('commits-list').innerHTML = '';

  const res = await window.dt.fetchCommits(taskId);
  if (!res.ok) {
    document.getElementById('commits-status').textContent = 'Fehler: ' + res.error;
    lastCommits = [];
    return;
  }

  lastCommits = res.commits;
  if (lastCommits.length === 0) {
    document.getElementById('commits-status').textContent = 'Keine neuen Commits';
    return;
  }

  document.getElementById('commits-status').textContent = res.isNew
    ? `Letzte ${lastCommits.length} Commits (erstmaliger Abruf)`
    : `${lastCommits.length} neue Commit${lastCommits.length > 1 ? 's' : ''}`;

  document.getElementById('commits-list').innerHTML = lastCommits.map(c => `
    <div class="commit-item${res.isNew ? '' : ' new-commit'}">
      <div class="commit-msg">${escapeHtml(c.message)}</div>
      <div class="commit-meta">
        <span class="commit-sha">${escapeHtml(c.short)}</span>
        <span>${escapeHtml(c.author)}</span>
        <span>${escapeHtml(c.date)}</span>
      </div>
    </div>
  `).join('');
}

function closeCommitsOverlay() {
  commitsTaskId = null;
  document.getElementById('commits-overlay').classList.remove('visible');
}

document.getElementById('commits-close').addEventListener('click', closeCommitsOverlay);

document.getElementById('commits-copy-btn').addEventListener('click', () => {
  if (lastCommits.length === 0) return;
  const text = lastCommits.map(c => `${c.short} ${c.message} (${c.author}, ${c.date})`).join('\n');
  navigator.clipboard.writeText(text);
  showToast('Commits kopiert');
});

document.getElementById('commits-overlay').addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeCommitsOverlay();
});

// ── Filter toggle ────────────────────────────────────────────────────────
document.getElementById('filter-unlinked').addEventListener('click', () => {
  filterUnlinked = !filterUnlinked;
  document.getElementById('filter-unlinked').classList.toggle('active', filterUnlinked);
  updateFilterLabel();
  renderTasks();
});

document.getElementById('filter-pending').addEventListener('click', () => {
  filterPending = !filterPending;
  document.getElementById('filter-pending').classList.toggle('active', filterPending);
  updateFilterLabel();
  renderTasks();
});

function updateFilterLabel() {
  const unlinkedCount = tasks.filter(t => !t.odoo_task_id).length;
  const btn = document.getElementById('filter-unlinked');
  btn.textContent = unlinkedCount > 0 ? `unlinked (${unlinkedCount})` : 'unlinked';

  const pendingCount = tasks.filter(t => t.unsynced_count > 0).length;
  const btnP = document.getElementById('filter-pending');
  btnP.textContent = pendingCount > 0 ? `upload (${pendingCount})` : 'upload';
}

// ── Task Merge ───────────────────────────────────────────────────────────
function startMerge(sourceId) {
  if (mergeSourceId === sourceId) { mergeSourceId = null; renderTasks(); return; }
  mergeSourceId = sourceId;
  renderTasks();
  showToast('Ziel-Task anklicken zum Mergen', '#5b9cf6');
}

async function doMerge(targetId) {
  if (!mergeSourceId || mergeSourceId === targetId) { mergeSourceId = null; renderTasks(); return; }
  const res = await window.dt.mergeTasks({ targetId, sourceId: mergeSourceId });
  mergeSourceId = null;
  if (res.ok) {
    showToast('Tasks zusammengeführt');
    await load();
  } else {
    showToast('Merge fehlgeschlagen: ' + res.error, '#e05c5c');
  }
}

// ── Mini mode (blur/focus) ────────────────────────────────────────────────
window.dt.onMiniMode((isMini) => {
  document.body.classList.toggle('mini', isMini);
  if (!isMini) load();
});

// Mini-bar click to expand
document.getElementById('mini-bar').addEventListener('click', () => {
  window.dt.expandWindow();
});

// Auto-refresh when Odoo poll finds new tasks
window.dt.onRefresh(() => load());

// ── Init ───────────────────────────────────────────────────────────────────
window.dt.getVersion().then(v => { document.getElementById('app-version').textContent = 'v' + v; }).catch(() => {});
load();
// Retry load in case IPC wasn't ready yet
setTimeout(load, 500);
setTimeout(load, 2000);
document.getElementById('task-input').focus();
</script>
