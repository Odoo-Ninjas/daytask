<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src *; img-src 'self' data:;">
<title>DayTask</title>
<link rel="manifest" href="/manifest.json">
<script src="/web-dt.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0f1117;
    --bg2: #161b27;
    --bg3: #1e2535;
    --line: #252d40;
    --accent: #3dd68c;
    --accent2: #5b9cf6;
    --warn: #f5a623;
    --danger: #e05c5c;
    --text: #d4dbe8;
    --muted: #5a6480;
    --done-text: #3a4560;
    --radius: 6px;
    --font-mono: 'IBM Plex Mono', monospace;
    --font: 'IBM Plex Sans', sans-serif;
  }

  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: transparent;
    font-family: var(--font);
    color: var(--text);
    user-select: none;
    -webkit-app-region: drag;
  }

  body.mini, body.mini html {
    height: 44px;
  }
  body.mini #app {
    border-radius: 8px;
  }
  body.mini #app > *:not(#mini-bar) {
    display: none;
  }
  body.mini #mini-bar {
    display: flex !important;
  }

  /* ── Mini bar ── */
  #mini-bar {
    display: none;
    align-items: center;
    gap: 8px;
    padding: 0 12px;
    height: 42px;
    -webkit-app-region: no-drag;
    cursor: pointer;
    flex-shrink: 0;
  }
  #mini-task-name {
    font-family: var(--font);
    font-size: 12px;
    color: var(--text);
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #mini-task-name.idle { color: var(--muted); }
  #mini-timer {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 600;
    color: var(--warn);
    letter-spacing: .04em;
    flex-shrink: 0;
  }
  #mini-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
    animation: pulse 2s infinite;
  }
  #mini-dot.idle { background: var(--muted); animation: none; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .3; }
  }

  #app {
    width: 100%;
    height: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.04);
    -webkit-app-region: no-drag;
  }

  /* ── Header ── */
  #header {
    padding: 12px 14px 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--line);
    -webkit-app-region: drag;
    flex-shrink: 0;
  }
  #header-title {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: .08em;
    text-transform: uppercase;
    flex: 1;
  }
  #active-clock {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 600;
    color: var(--warn);
    letter-spacing: .04em;
    display: none;
  }
  #active-clock.visible { display: block; }
  .header-btn {
    -webkit-app-region: no-drag;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--muted);
    font-size: 14px;
    padding: 2px 4px;
    border-radius: 4px;
    transition: color .15s;
  }
  .header-btn:hover { color: var(--text); }
  .header-btn .rot-ico { display: block; transition: transform .35s ease; }
  .header-btn:hover .rot-ico { transform: rotate(-180deg); }
  .header-btn.spinning .rot-ico { animation: dt-spin .7s linear infinite; }
  .header-btn.spinning { color: var(--accent2); }
  @keyframes dt-spin { to { transform: rotate(360deg); } }

  /* ── Quick Add ── */
  #quick-add {
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  #add-row, #add-row2 {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  #add-row2, #add-row3 { margin-top: 6px; }
  #task-input {
    flex: 1;
    background: var(--bg3);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    padding: 7px 10px;
    outline: none;
    transition: border-color .15s;
  }
  #task-input:focus { border-color: var(--accent2); }
  #task-input::placeholder { color: var(--muted); }

  /* ── Days strip (letzte 10 Tage) ── */
  #days-strip {
    display: flex;
    align-items: stretch;
    border-bottom: 1px solid var(--line);
    background: var(--bg2);
    cursor: pointer;
    padding: 4px 6px;
    gap: 2px;
    flex-shrink: 0;
    -webkit-app-region: no-drag;
  }
  #days-strip .ds-month {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--muted);
    padding: 0 4px;
    text-transform: uppercase;
    letter-spacing: .06em;
  }
  #days-strip .ds-day {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 3px 0;
    border-radius: 4px;
    line-height: 1.1;
  }
  #days-strip .ds-buckets {
    display: flex;
    flex-direction: row;
    align-items: baseline;
    justify-content: center;
    gap: 4px;
    min-height: 12px;
    margin-top: 1px;
  }
  #days-strip .ds-day.today { background: rgba(61,214,140,.10); }
  #days-strip .ds-day.weekend .ds-wd { color: var(--danger); }
  #days-strip .ds-wd {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--text);
    font-weight: 600;
    letter-spacing: .04em;
  }
  #days-strip .ds-date {
    font-family: var(--font-mono);
    font-size: 8px;
    color: var(--muted);
  }
  #days-strip .ds-hours {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 600;
    color: var(--warn);
  }
  #days-strip .ds-hours.zero { color: var(--muted); font-weight: 400; }
  #days-strip .ds-bucket {
    font-family: var(--font-mono);
    font-size: 9px;
    font-weight: 600;
    line-height: 1.1;
    display: inline-block;
  }
  #days-strip.loading { opacity: .55; }
  #ticket-input {
    width: 90px;
    background: var(--bg3);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--accent2);
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 7px 8px;
    outline: none;
    transition: border-color .15s;
  }
  #ticket-input:focus { border-color: var(--accent2); }
  #ticket-input::placeholder { color: var(--muted); }
  #project-input:focus { border-color: var(--accent2); }
  #project-input::placeholder { color: var(--muted); }
  .proj-drop-item {
    padding: 5px 8px;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text);
    cursor: pointer;
    line-height: 1.4;
    word-break: break-word;
  }
  .proj-drop-item:hover, .proj-drop-item.selected { background: var(--bg2); color: var(--accent); }
  .proj-drop-sep {
    border-top: 1px solid var(--line);
    margin: 2px 0;
    font-family: var(--font-mono);
    font-size: 8px;
    color: var(--muted);
    padding: 3px 8px 1px;
    text-transform: uppercase;
    letter-spacing: .08em;
  }
  #add-btn {
    background: var(--accent);
    border: none;
    border-radius: var(--radius);
    color: #0f1117;
    font-size: 16px;
    font-weight: 700;
    width: 30px;
    height: 30px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity .15s;
    flex-shrink: 0;
  }
  #add-btn:hover { opacity: .85; }

  /* ── Active task banner ── */
  #active-banner {
    display: none;
    background: linear-gradient(90deg, rgba(245,166,35,.08), transparent);
    border-bottom: 1px solid rgba(245,166,35,.2);
    padding: 7px 14px;
    font-size: 12px;
    color: var(--warn);
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  #active-banner.visible { display: flex; }
  #active-banner-title { flex: 1; font-family: var(--font-mono); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #stop-btn {
    background: rgba(245,166,35,.15);
    border: 1px solid rgba(245,166,35,.3);
    border-radius: 4px;
    color: var(--warn);
    font-size: 11px;
    font-family: var(--font-mono);
    padding: 3px 8px;
    cursor: pointer;
    transition: background .15s;
    white-space: nowrap;
  }
  #stop-btn:hover { background: rgba(245,166,35,.25); }

  /* ── Task list ── */
  #task-list-wrap {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 6px 0;
  }
  #task-list-wrap::-webkit-scrollbar { width: 4px; }
  #task-list-wrap::-webkit-scrollbar-track { background: transparent; }
  #task-list-wrap::-webkit-scrollbar-thumb { background: var(--line); border-radius: 2px; }

  .section-label {
    font-family: var(--font-mono);
    font-size: 9px;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 8px 14px 4px;
  }
  .section-toggle { cursor: pointer; user-select: none; }
  .section-toggle:hover { color: var(--text); }
  .section-toggle .caret { display: inline-block; width: 1em; margin-right: 2px; }
  .kanban-lane-head.section-toggle:hover { color: var(--accent2); }

  .task-item {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    row-gap: 6px;
    gap: 8px;
    padding: 7px 12px;
    border-radius: 6px;
    margin: 1px 6px;
    cursor: pointer;
    transition: background .1s;
    position: relative;
  }
  .task-item:hover { background: var(--bg2); }
  .task-item.active { background: rgba(245,166,35,.06); }
  .task-item.done { opacity: .4; }
  .task-item.archived { opacity: .35; background: repeating-linear-gradient(45deg, transparent, transparent 6px, rgba(255,255,255,.02) 6px, rgba(255,255,255,.02) 12px); }
  .task-item.archived .task-title { text-decoration: line-through; color: var(--muted); }

  .task-check {
    width: 16px;
    height: 16px;
    border: 1.5px solid var(--line);
    border-radius: 4px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    transition: all .15s;
    cursor: pointer;
  }
  .task-check:hover { border-color: var(--accent); }
  .task-item.done .task-check { background: var(--accent); border-color: var(--accent); color: #0f1117; }

  .task-body { flex: 1; min-width: 0; }
  .task-title {
    font-size: 13px;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
    white-space: nowrap;
    line-height: 1.3;
  }
  .task-item.done .task-title { color: var(--done-text); text-decoration: line-through; }
  .task-item.active .task-title { color: var(--warn); }

  .task-meta {
    display: flex;
    gap: 6px;
    align-items: center;
    margin-top: 2px;
    flex-wrap: nowrap;
    overflow: hidden;
  }
  .ticket-badge {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--accent2);
    background: rgba(91,156,246,.1);
    border-radius: 3px;
    padding: 0 5px;
    line-height: 16px;
  }
  .budget-badge {
    font-family: var(--font-mono);
    font-size: 10px;
    border-radius: 3px;
    padding: 0 5px;
    line-height: 16px;
    white-space: nowrap;
  }
  .budget-badge.under {
    color: #3dd68c;
    background: rgba(61,214,140,.10);
  }
  .budget-badge.near {
    color: #e6b94a;
    background: rgba(230,185,74,.12);
  }
  .budget-badge.over {
    color: #ff6b6b;
    background: rgba(255,107,107,.12);
  }
  .task-time {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
  }
  .task-item.active .task-time { color: var(--warn); }

  .task-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    flex-shrink: 0;
    justify-content: flex-end;
    margin-left: auto;
  }
  .task-action-btn {
    background: var(--bg2);
    border: 1px solid var(--line);
    cursor: pointer;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.1;
    padding: 5px 8px;
    border-radius: 5px;
    transition: all .1s;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }
  .task-action-btn .lbl {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: .02em;
  }
  .task-action-btn:hover { background: var(--bg3); color: var(--text); border-color: var(--accent2); }
  .task-action-btn.play { color: var(--accent); border-color: rgba(61,214,140,.4); }
  .task-action-btn.play:hover { color: var(--accent); border-color: var(--accent); }
  .task-action-btn.del:hover { color: var(--danger); border-color: var(--danger); }
  .task-action-btn.prio.prio-on { color: #f5a623; border-color: rgba(245,166,35,.5); }
  .task-action-btn.prio:hover { color: #f5a623; }

  /* ── Footer ── */
  #footer {
    border-top: 1px solid var(--line);
    padding: 8px 14px;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-shrink: 0;
  }
  #today-summary {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
    flex: 1;
  }
  #today-summary span { color: var(--accent2); }

  /* ── Odoo sync feedback ── */
  #sync-toast {
    position: absolute;
    bottom: 50px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--bg3);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 14px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--accent);
    opacity: 0;
    transition: opacity .3s;
    pointer-events: none;
    white-space: nowrap;
    z-index: 100;
  }
  #sync-toast.show { opacity: 1; }

  #undo-toast {
    position: absolute;
    bottom: 50px;
    left: 50%;
    transform: translateX(-50%);
    display: none;
    align-items: center;
    gap: 10px;
    background: var(--bg3);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 10px 6px 14px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text);
    white-space: nowrap;
    z-index: 101;
    box-shadow: 0 4px 12px rgba(0,0,0,.35);
  }
  #undo-toast.show { display: flex; }
  #undo-toast button {
    background: none;
    border: 1px solid var(--accent);
    color: var(--accent);
    border-radius: 4px;
    padding: 2px 8px;
    font-family: var(--font-mono);
    font-size: 10px;
    cursor: pointer;
  }
  #undo-toast button:hover { background: var(--accent); color: var(--bg); }

  #empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.8;
  }
  #empty .emoji { font-size: 28px; display: block; margin-bottom: 8px; }

  /* ── Odoo link badge ── */
  .odoo-badge {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--accent);
    background: rgba(61,214,140,.1);
    border-radius: 3px;
    padding: 0 5px;
    line-height: 16px;
    max-width: 140px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    cursor: pointer;
  }
  .odoo-badge:hover { background: rgba(61,214,140,.2); }
  .unsynced-badge {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--warn);
    background: rgba(245,166,35,.1);
    border-radius: 3px;
    padding: 0 5px;
    line-height: 16px;
    white-space: nowrap;
    flex-shrink: 0;
    transition: background .12s;
  }
  .unsynced-badge:hover { background: rgba(245,166,35,.25); }

  /* ── Odoo search overlay ── */
  #odoo-search-overlay {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(15,17,23,.92);
    z-index: 200;
    flex-direction: column;
    padding: 14px;
  }
  #odoo-search-overlay.visible { display: flex; }

  #odoo-search-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  #odoo-search-header .title {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: .06em;
    text-transform: uppercase;
    flex: 1;
  }
  #odoo-search-close {
    background: none; border: none; cursor: pointer;
    color: var(--muted); font-size: 16px; padding: 2px 6px;
  }
  #odoo-search-close:hover { color: var(--text); }

  #odoo-search-input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    padding: 8px 10px;
    outline: none;
    margin-bottom: 8px;
  }
  #odoo-search-input:focus { border-color: var(--accent); }
  #odoo-search-input::placeholder { color: var(--muted); }

  #odoo-search-status {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
    margin-bottom: 6px;
    min-height: 14px;
  }

  #odoo-search-results {
    flex: 1;
    overflow-y: auto;
    padding-right: 4px;
  }
  #odoo-search-results::-webkit-scrollbar { width: 4px; }
  #odoo-search-results::-webkit-scrollbar-thumb { background: var(--line); border-radius: 2px; }

  .odoo-result-item {
    padding: 8px 10px;
    border-radius: 5px;
    cursor: pointer;
    transition: background .1s;
    margin-bottom: 2px;
  }
  .odoo-result-item:hover, .odoo-result-item.selected { background: var(--bg2); }
  .odoo-result-item.selected { border-left: 2px solid var(--accent); }

  .odoo-result-project {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--accent2);
    margin-bottom: 2px;
  }
  .odoo-result-name {
    font-size: 12px;
    color: var(--text);
    line-height: 1.3;
  }
  .odoo-result-no {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
    margin-left: 6px;
  }
  .odoo-result-ticket {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--accent);
    font-weight: 600;
  }

  #odoo-unlink-btn {
    background: rgba(224,92,92,.1);
    border: 1px solid rgba(224,92,92,.2);
    border-radius: 4px;
    color: var(--danger);
    font-family: var(--font-mono);
    font-size: 10px;
    padding: 4px 10px;
    cursor: pointer;
    margin-top: 8px;
    align-self: flex-start;
    display: none;
  }
  #odoo-unlink-btn.visible { display: block; }
  #odoo-unlink-btn:hover { background: rgba(224,92,92,.2); }

  /* ── Project config overlay ── */
  #project-overlay {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(15,17,23,.92);
    z-index: 200;
    flex-direction: column;
    padding: 14px;
  }
  #project-overlay.visible { display: flex; }

  .proj-field { margin-bottom: 8px; }
  .proj-field label {
    display: block;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
    margin-bottom: 3px;
    text-transform: uppercase;
    letter-spacing: .08em;
  }
  .proj-field input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 7px 10px;
    outline: none;
  }
  .proj-field input:focus { border-color: var(--accent2); }
  .proj-field input::placeholder { color: var(--muted); }

  .proj-actions { display: flex; gap: 8px; margin-top: 10px; }
  .proj-actions button {
    background: var(--bg3);

  #dayview-extra-prompt {

  /* ── Done history overlay ── */
  #done-history-overlay {
    display: none;

    background: rgba(15,17,23,.95);

    flex-direction: column;

  }

  }

    font-weight: 600;

  }
  #done-history-list {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .dh-row {
    display: grid;

    gap: 8px;
    padding: 6px 8px;
    background: var(--bg2);
    border: 1px solid var(--line);

    font-size: 11px;
    font-family: var(--font-mono);
    align-items: center;
  }
  .dh-row .dh-date { color: var(--muted); white-space: nowrap; }

  .dh-row .dh-time { color: var(--accent); text-align: right; white-space: nowrap; }
  #done-history-empty { color: var(--muted); font-size: 11px; padding: 12px; text-align: center; }

  #commits-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  #commits-header .title {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    color: var(--accent2);
    letter-spacing: .06em;
    text-transform: uppercase;
    flex: 1;
  }
  #commits-close {
    background: none; border: none; cursor: pointer;
    color: var(--muted); font-size: 16px; padding: 2px 6px;
  }
  #commits-close:hover { color: var(--text); }

  #commits-status {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
    margin-bottom: 6px;
  }

  #commits-list {
    flex: 1;
    overflow-y: auto;
    padding-right: 4px;
  }
  #commits-list::-webkit-scrollbar { width: 4px; }
  #commits-list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 2px; }

  .commit-item {
    padding: 6px 8px;
    border-left: 2px solid var(--line);

    margin-left: 4px;

  .commit-item.new-commit { border-left-color: var(--accent); }

  #commits-copy-btn {

    border-radius: 4px;

    font-family: var(--font-mono);
    font-size: 10px;
    padding: 4px 10px;
    cursor: pointer;
  }

  /* ── Filter bar ── */
  #filter-bar {

  .filter-btn {

  .filter-btn:hover { border-color: var(--accent2); color: var(--text); }
  .filter-btn.active { background: rgba(245,166,35,.15); border-color: var(--warn); color: var(--warn); }

  #status-bar {
    display: flex;
    gap: 6px;
    padding: 8px 16px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
    -webkit-app-region: no-drag;

  #status-bar::-webkit-scrollbar { display: none; }
  #status-bar:empty { display: none; }
  .status-chip {
    -webkit-app-region: no-drag;
    background: var(--bg2);
    border: 1px solid var(--line);
    border-radius: 12px;
    cursor: pointer;
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 5px 12px;
    white-space: nowrap;
    transition: all .15s;
  }
  .status-chip:hover { border-color: var(--accent2); color: var(--text); }
  .status-chip.active { background: rgba(74,165,235,.18); border-color: var(--accent2); color: var(--accent2); }
  .status-chip .count { opacity: .6; margin-left: 4px; }

  /* ── Merge mode ── */
  .task-item.merge-source { outline: 2px solid var(--accent); outline-offset: -2px; }
  .task-item.merge-target:hover { outline: 2px dashed var(--accent2); outline-offset: -2px; }

  /* ── Keyboard focus ── */
  .task-item.kbd-focus { outline: 2px solid var(--accent2); outline-offset: -2px; background: rgba(61,214,140,.06); }

  /* ── Kanban ── */
  #task-list-wrap.kanban-mode { overflow-x: auto; }
  #task-list-wrap.kanban-mode #task-list { min-height: 100%; }
  .kanban-board {
    display: flex;

    padding: 14px 16px;

  }

  .kanban-col-head {
    position: sticky;
    top: 0;
    z-index: 2;
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;

    padding: 12px 15px;
    border-bottom: 1px solid var(--line);
    background: var(--bg2);
    border-radius: 10px 10px 0 0;
    display: flex;
    justify-content: space-between;
    align-items: center;

  .kanban-col-head .count { color: var(--muted); font-weight: 400; }

    padding: 12px 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .kanban-col-body:empty::after {

    padding: 18px;

  .kanban-col .task-item { margin: 0; padding: 10px 12px; background: var(--bg); }

  /* Titel im Kanban komplett lesbar (umbrechen statt abschneiden) */
  .kanban-col .task-title { white-space: normal; overflow: visible; text-overflow: clip; }
  /* Buttons im Kanban ueber die ganze Kartenbreite umbrechen */
  .kanban-col .task-body { flex: 1 1 100%; }
  .kanban-col .task-actions { width: 100%; margin-left: 0; margin-top: 6px; justify-content: flex-start; }
  /* Kein Merge-Button im Kanban */
  .kanban-col .task-action-btn[data-merge] { display: none; }

  /* ── Kanban Swimlanes (Kanban + Projekt-Gruppierung) ── */
  .kanban-swim-wrap { padding: 14px 16px; width: max-content; }
  .kanban-swim-wrap .kanban-board { padding: 0; }
  .kanban-header-row {
    position: sticky;
    top: 0;
    z-index: 3;
    background: var(--bg);
    margin-bottom: 10px;

  .kanban-header-row .kanban-col { background: transparent; border: none; }
  .kanban-header-row .kanban-col-head { border-radius: 8px; border-bottom: 1px solid var(--line); }
  .kanban-swimlane { margin-bottom: 26px; }
  .kanban-lane-head {
    position: sticky;
    left: 0;
    z-index: 2;
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 600;
    color: var(--accent2);
    text-transform: uppercase;
    letter-spacing: .06em;
    padding: 8px 8px 8px;
  }
  .kanban-lane-head .count { color: var(--muted); font-weight: 400; margin-left: 6px; }
  .kanban-col--lane { min-height: 52px; }
</style>

<div id="app">
  <div id="mini-bar">
    <span id="mini-dot" class="idle"></span>
    <span id="mini-task-name" class="idle">Kein aktiver Task</span>
    <span id="mini-timer"></span>

  <div id="days-strip" title="Letzte 10 Tage – Klick auf einen Tag öffnet die Timesheets in Odoo"></div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let tasks = [];
let activeTaskId = null;
let activeSlotId = null;
let tickStart = null; // Date.now() when active slot started (approximate)
let elapsedBase = 0;  // seconds already counted before this slot
let filterUnlinked = false;
let filterPending = false;
let filterArchive = true;
// Chronologisch: pro Tag in Erstellungsreihenfolge (neueste oben),
// statt nach Priorität/letzter Aktivität. Hilft beim Wiederfinden.
let sortChrono = (() => { try { return localStorage.getItem('sortChrono') === '1'; } catch { return false; } })();
// Nur Aufgaben mit Priorität anzeigen (persistiert).
let filterPriority = (() => { try { return localStorage.getItem('filterPriority') === '1'; } catch { return false; } })();
// Nach Odoo-Projekt gruppieren (persistiert).
let groupByProject = (() => { try { return localStorage.getItem('groupByProject') === '1'; } catch { return false; } })();
// Eingeklappte Projektgruppen (persistiert, gilt für Listen- und Kanban-Gruppierung).
let collapsedProjects = (() => { try { return new Set(JSON.parse(localStorage.getItem('collapsedProjects') || '[]')); } catch { return new Set(); } })();
function toggleProjectCollapse(p) {
  if (collapsedProjects.has(p)) collapsedProjects.delete(p); else collapsedProjects.add(p);
  try { localStorage.setItem('collapsedProjects', JSON.stringify([...collapsedProjects])); } catch {}
}
// Kanban-Ansicht nach Stufen (persistiert).
let viewKanban = (() => { try { return localStorage.getItem('viewKanban') === '1'; } catch { return false; } })();
let statusFilter = (() => {
  try {
    const raw = localStorage.getItem('statusFilter');
    if (raw) return new Set(JSON.parse(raw));
  } catch {}
  return new Set();
})();
function saveStatusFilter() {
  try { localStorage.setItem('statusFilter', JSON.stringify([...statusFilter])); } catch {}
}
let statusFilterOrder = ['progress', 'inbox', 'waiting', 'todo', 'abgeschlossen'];
(async () => {
  try {
    const cfg = await window.dt.getConfig();
    if (cfg && typeof cfg.status_filter_order === 'string' && cfg.status_filter_order.trim()) {
      statusFilterOrder = cfg.status_filter_order.split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
    }
  } catch {}
})();
let archiveResults = [];
let archiveSearchTimer = null;
let mergeSourceId = null;
let searchQuery = '';
// IDs of just-created tasks that bypass all current filters until the next
// filter interaction. Lets the user see a freshly added task even if their
// active filter would otherwise hide it.
let justAddedIds = new Set();
function clearJustAdded() { if (justAddedIds.size) { justAddedIds.clear(); } }
let kbdSelectedId = null;
let budgetCache = {}; // odoo_task_id -> { allocated, effective, remaining, progress }
let budgetFetchTimer = null;

function setKbdFocus(id) {
  kbdSelectedId = id;
  document.querySelectorAll('#task-list .task-item[data-id]').forEach(el => {
    const match = +el.dataset.id === id;
    el.classList.toggle('kbd-focus', match);
    if (match) el.scrollIntoView({ block: 'nearest' });
  });
}

function moveKbdFocus(delta) {
  const items = [...document.querySelectorAll('#task-list .task-item[data-id]')];
  if (!items.length) return;
  const ids = items.map(el => +el.dataset.id);
  const cur = ids.indexOf(kbdSelectedId);
  const next = cur < 0 ? (delta > 0 ? 0 : ids.length - 1) : Math.max(0, Math.min(ids.length - 1, cur + delta));
  setKbdFocus(ids[next]);
}

// ── Helpers ────────────────────────────────────────────────────────────────
function fmtSeconds(s) {
  s = Math.max(0, Math.round(s));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const ss = s % 60;
  if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
  return `${m}:${String(ss).padStart(2,'0')}`;
}

function showToast(msg, color = '#3dd68c') {
  const t = document.getElementById('sync-toast');
  t.textContent = msg;
  t.style.color = color;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

let _undoTimer = null;
let _undoHandler = null;
function showUndoToast(msg, onUndo, timeoutMs = 6000) {
  const el = document.getElementById('undo-toast');
  document.getElementById('undo-toast-msg').textContent = msg;
  _undoHandler = onUndo;
  el.classList.add('show');
  clearTimeout(_undoTimer);
  _undoTimer = setTimeout(() => {
    el.classList.remove('show');
    _undoHandler = null;
  }, timeoutMs);
}
document.getElementById('undo-toast-btn').addEventListener('click', async () => {
  const h = _undoHandler;
  _undoHandler = null;
  clearTimeout(_undoTimer);
  document.getElementById('undo-toast').classList.remove('show');
  if (h) await h();
});

// ── Render ─────────────────────────────────────────────────────────────────
let odooSearchResults = [];
let odooSearchTimer2 = null;

// Sortierrang einer Stufe/Status nach konfigurierter Reihenfolge.
function statusRank(name) {
  const n = (name || '').toLowerCase();
  for (let i = 0; i < statusFilterOrder.length; i++) {
    if (n.includes(statusFilterOrder[i])) return i;
  }
  return statusFilterOrder.length;
}

// Stufe (Odoo-Stage) einer Aufgabe, mit Fallback.
function taskStage(t) {
  return (t.odoo_stage || '').trim() || '∅ ohne Status';
}

// Projektname einer Aufgabe – aus dem Odoo-Label "Projekt / Task" abgeleitet.
function taskProject(t) {
  const lbl = (t.odoo_task_label || '').trim();
  if (lbl.includes(' / ')) {
    const p = lbl.split(' / ')[0].trim();
    if (p) return p;
  }
  return 'Ohne Projekt';
}

function renderStatusBar() {
  const bar = document.getElementById('status-bar');
  if (!bar) return;
  const counts = new Map();
  for (const t of tasks) {
    const s = (t.odoo_stage || '').trim() || '∅ ohne Status';
    counts.set(s, (counts.get(s) || 0) + 1);
  }
  // remove obsolete filter selections
  let pruned = false;
  for (const s of Array.from(statusFilter)) if (!counts.has(s)) { statusFilter.delete(s); pruned = true; }
  if (pruned) saveStatusFilter();
  if (counts.size <= 1) { bar.innerHTML = ''; return; }
  const entries = Array.from(counts.entries()).sort((a, b) => {
    const r = statusRank(a[0]) - statusRank(b[0]);
    return r !== 0 ? r : b[1] - a[1];
  });
  bar.innerHTML = entries.map(([name, n]) => {
    const active = statusFilter.has(name) ? ' active' : '';
    return `<button class="status-chip${active}" data-status="${escapeHtml(name)}">${escapeHtml(name)}<span class="count">${n}</span></button>`;
  }).join('');
}

function dayLabel(day) {
  if (!day) return 'Ohne Datum';
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  const todayStr = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
  const y = new Date(now); y.setDate(now.getDate() - 1);
  const yStr = `${y.getFullYear()}-${pad(y.getMonth() + 1)}-${pad(y.getDate())}`;
  if (day === todayStr) return 'Heute';
  if (day === yStr) return 'Gestern';
  const [yr, mo, dy] = day.split('-');
  return `${dy}.${mo}.${yr}`;
}

// Sortierung innerhalb einer Spalte/Gruppe: offen vor erledigt, Prio zuerst, dann jüngste.
function sortInGroup(a, b) {
  return (a.done ? 1 : 0) - (b.done ? 1 : 0)
    || (b.priority ? 1 : 0) - (a.priority ? 1 : 0)
    || (b.id - a.id);
}

// Stufen (Odoo-Stages) einer Task-Menge als Map stage->count, geordnet nach Reihenfolge.
function stagesOf(taskArr) {
  const counts = new Map();
  for (const t of taskArr) {
    const s = taskStage(t);
    counts.set(s, (counts.get(s) || 0) + 1);
  }
  const order = [...counts.keys()].sort((a, b) =>
    (statusRank(a) - statusRank(b)) || a.localeCompare(b));
  return { counts, order };
}

// Kanban-Board: eine Spalte je Stufe. Bei aktiver Projekt-Gruppierung -> Swimlanes.
function renderKanban(filtered) {
  if (filtered.length === 0) return '';
  if (groupByProject) return renderKanbanSwimlanes(filtered);
  const { counts, order } = stagesOf(filtered);
  const byStage = new Map();
  for (const t of filtered) {
    const s = taskStage(t);
    if (!byStage.has(s)) byStage.set(s, []);
    byStage.get(s).push(t);
  }
  let html = '<div class="kanban-board">';
  for (const s of order) {
    const items = byStage.get(s).sort(sortInGroup);
    html += `<div class="kanban-col">
      <div class="kanban-col-head">${escapeHtml(s)}<span class="count">${items.length}</span></div>
      <div class="kanban-col-body">${items.map(taskHTML).join('')}</div>
    </div>`;
  }
  return html + '</div>';
}

// Kanban mit Projekt-Swimlanes: Stufen als Spalten (oben Kopfzeile), je Projekt eine Zeile.
function renderKanbanSwimlanes(filtered) {
  const { counts, order } = stagesOf(filtered); // gemeinsame Spalten über alle Lanes
  if (order.length === 0) return '';

  const byProj = new Map();
  for (const t of filtered) {
    const p = taskProject(t);
    if (!byProj.has(p)) byProj.set(p, []);
    byProj.get(p).push(t);
  }
  const projs = [...byProj.keys()].sort((a, b) => {
    if (a === 'Ohne Projekt') return 1;
    if (b === 'Ohne Projekt') return -1;
    return a.localeCompare(b);
  });

  let html = '<div class="kanban-swim-wrap">';
  // Sticky Kopfzeile mit den Stufennamen (einmal oben)
  html += '<div class="kanban-board kanban-header-row">';
  for (const s of order) {
    html += `<div class="kanban-col"><div class="kanban-col-head">${escapeHtml(s)}<span class="count">${counts.get(s)}</span></div></div>`;
  }
  html += '</div>';
  // Eine Swimlane je Projekt
  for (const p of projs) {
    const items = byProj.get(p);
    const byStage = new Map();
    for (const t of items) {
      const s = taskStage(t);
      if (!byStage.has(s)) byStage.set(s, []);
      byStage.get(s).push(t);
    }
    const collapsed = collapsedProjects.has(p);
    html += '<div class="kanban-swimlane">';
    html += `<div class="kanban-lane-head section-toggle" data-proj-collapse="${escapeHtml(p)}"><span class="caret">${collapsed ? '▸' : '▾'}</span>${escapeHtml(p)}<span class="count">${items.length}</span></div>`;
    if (!collapsed) {
      html += '<div class="kanban-board">';
      for (const s of order) {
        const col = (byStage.get(s) || []).sort(sortInGroup);
        html += `<div class="kanban-col kanban-col--lane"><div class="kanban-col-body">${col.map(taskHTML).join('')}</div></div>`;
      }
      html += '</div>';
    }
    html += '</div>';
  }
  return html + '</div>';
}

// Listen-Gruppierung nach Odoo-Projekt ("Ohne Projekt" ans Ende).
function renderGroupedByProject(filtered) {
  const byProj = new Map();
  for (const t of filtered) {
    const p = taskProject(t);
    if (!byProj.has(p)) byProj.set(p, []);
    byProj.get(p).push(t);
  }
  const projs = [...byProj.keys()].sort((a, b) => {
    if (a === 'Ohne Projekt') return 1;
    if (b === 'Ohne Projekt') return -1;
    return a.localeCompare(b);
  });
  let html = '';
  for (const p of projs) {
    const items = byProj.get(p).sort(sortInGroup);
    const collapsed = collapsedProjects.has(p);
    html += `<div class="section-label section-toggle" data-proj-collapse="${escapeHtml(p)}"><span class="caret">${collapsed ? '▸' : '▾'}</span>${escapeHtml(p)} (${items.length})</div>`;
    if (!collapsed) for (const t of items) html += taskHTML(t);
  }
  return html;
}

function renderTasks() {
  renderStatusBar();
  const list = document.getElementById('task-list');
  const exempt = t => justAddedIds.has(t.id);
  let filtered = tasks;
  if (filterUnlinked) filtered = filtered.filter(t => exempt(t) || !t.odoo_task_id);
  if (filterPending) filtered = filtered.filter(t => exempt(t) || t.unsynced_count > 0);
  if (filterPriority) filtered = filtered.filter(t => exempt(t) || t.priority);
  if (statusFilter.size > 0) {
    filtered = filtered.filter(t => exempt(t) || statusFilter.has(((t.odoo_stage || '').trim() || '∅ ohne Status')));
  }
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    // Basename des Arbeitsverzeichnisses = ursprünglicher (slugifizierter) Ordnername,
    // der beim Anlegen aus dem Titel entsteht und auch nach Titel-Umbenennung bleibt.
    const dirName = t => (t.working_dir || t.vscode_path || '').split('/').pop().toLowerCase();
    filtered = filtered.filter(t => exempt(t) ||
      (t.title || '').toLowerCase().includes(q) ||
      (t.ticket_ref || '').toLowerCase().includes(q) ||
      (t.odoo_task_label || '').toLowerCase().includes(q) ||
      (t.odoo_stage || '').toLowerCase().includes(q) ||
      (t.git_branch || '').toLowerCase().includes(q) ||
      (t.note || '').toLowerCase().includes(q) ||
      (t.sequence_name || '').toLowerCase().includes(q) ||
      dirName(t).includes(q) ||
      (t.odoo_task_id != null && String(t.odoo_task_id).includes(q))
    );
  }
  let html = '';

  if (viewKanban) {
    // Kanban: Spalten = Stufen (Odoo-Stages). Filter greifen über `filtered`.
    html = renderKanban(filtered);
  } else if (groupByProject) {
    // Gruppierung nach Odoo-Projekt.
    html = renderGroupedByProject(filtered);
  } else if (sortChrono) {
    // Pro Tag gruppiert, innerhalb des Tages in Erstellungsreihenfolge (neueste oben).
    const byDay = new Map();
    for (const t of filtered) {
      const day = (t.date || (t.created_at || '').slice(0, 10) || '').slice(0, 10);
      if (!byDay.has(day)) byDay.set(day, []);
      byDay.get(day).push(t);
    }
    const days = [...byDay.keys()].sort().reverse(); // neuester Tag oben
    for (const day of days) {
      const items = byDay.get(day).sort((a, b) =>
        (b.created_at || '').localeCompare(a.created_at || '') || (b.id - a.id));
      html += `<div class="section-label">${dayLabel(day)} (${items.length})</div>`;
      for (const t of items) html += taskHTML(t);
    }
  } else {
    const active = filtered.filter(t => !t.done);
    const done = filtered.filter(t => t.done);

    if (active.length > 0) {
      html += `<div class="section-label">Lokal (${active.length})</div>`;
      for (const t of active) html += taskHTML(t);
    }
    if (done.length > 0) {
      html += `<div class="section-label">Erledigt (${done.length})</div>`;
      for (const t of done) html += taskHTML(t);
    }
  }

  // Archive search results (older days, only when filterArchive on + searchQuery)
  if (!viewKanban && filterArchive && searchQuery && searchQuery.length >= 2 && archiveResults.length > 0) {
    const localIds = new Set(tasks.map(t => t.id));
    const archiveFiltered = archiveResults.filter(r => !localIds.has(r.id));
    if (archiveFiltered.length > 0) {
      html += `<div class="section-label">Archiv (${archiveFiltered.length})</div>`;
      for (const t of archiveFiltered) {
        const dateLabel = (t.date || '').slice(5);
        html += taskHTML(t).replace(
          'class="task-title">',
          `class="task-title"><span style="color:var(--muted);font-family:var(--font-mono);font-size:10px;margin-right:4px">${dateLabel}</span>`
        );
      }
    }
  }

  // Odoo search results
  if (!viewKanban && searchQuery && searchQuery.length >= 2 && odooSearchResults.length > 0) {
    // Filter out already-linked tasks
    const linkedIds = new Set(tasks.filter(t => t.odoo_task_id).map(t => t.odoo_task_id));
    const odooFiltered = odooSearchResults.filter(r => !linkedIds.has(r.id));
    if (odooFiltered.length > 0) {
      html += `<div class="section-label" style="color:var(--accent2)">Odoo (${odooFiltered.length})</div>`;
      for (const t of odooFiltered) {
        html += `<div class="task-item odoo-ext" data-odoo-create="${t.id}" data-odoo-name="${escapeHtml(t.name)}" data-odoo-proj-id="${t.project_id}" data-odoo-proj-name="${escapeHtml(t.project_name)}" data-odoo-deadline="${t.date_deadline || ''}" data-odoo-seq="${escapeHtml(t.sequence_name || '')}" data-odoo-branch="${escapeHtml(t.branch_name || '')}" data-odoo-repo="${escapeHtml(t.repo || '')}" style="cursor:pointer;border-left:3px solid var(--accent2)">
          <div class="task-body">
            <div class="task-title"><span style="color:var(--accent2);font-family:var(--font-mono);font-size:10px;margin-right:4px">${escapeHtml(t.sequence_name || '')}</span>${escapeHtml(t.name)}</div>
            <div class="task-meta"><span style="color:var(--accent2);font-size:9px">${escapeHtml(t.project_name)}</span></div>
          </div>
        </div>`;
      }
    }
  }

  if (!html) {
    list.innerHTML = `<div id="empty"><span class="emoji">🌅</span>${filterUnlinked ? 'Alle Tasks sind verknüpft.' : filterPending ? 'Keine ausstehenden Uploads.' : 'Noch keine Aufgaben heute.<br>Einfach oben eintippen.'}</div>`;
    return;
  }

  list.innerHTML = html;

  // Update footer
  const totalSec = tasks.reduce((s, t) => s + (t.total_seconds || 0), 0);
  const extraSec = (activeTaskId && tickStart) ? (Date.now() - tickStart) / 1000 : 0;
  document.getElementById('total-time').textContent = fmtSeconds(totalSec + extraSec);
  document.getElementById('done-count').textContent = filtered.filter(t => t.done).length;
  const unsyncedSec = tasks.reduce((s, t) => s + (t.unsynced_seconds || 0), 0);
  const unsyncedEl = document.getElementById('unsynced-time');
  unsyncedEl.textContent = unsyncedSec > 0 ? `${fmtSeconds(unsyncedSec)} offen` : '';

  // Active banner
  const activeTask = tasks.find(t => t.id === activeTaskId);
  const banner = document.getElementById('active-banner');
  if (activeTask) {
    banner.classList.add('visible');
    document.getElementById('active-banner-title').textContent = activeTask.title;
  } else {
    banner.classList.remove('visible');
  }

  // Re-apply keyboard focus after re-render
  if (kbdSelectedId) {
    const el = document.querySelector(`#task-list .task-item[data-id="${kbdSelectedId}"]`);
    if (el) el.classList.add('kbd-focus');
  }
}

function taskHTML(t) {
  const isActive = t.id === activeTaskId;
  const isMergeSource = t.id === mergeSourceId;
  const cls = [isActive ? 'active' : '', t.done ? 'done' : '', t.archived ? 'archived' : '', isMergeSource ? 'merge-source' : '', mergeSourceId && !isMergeSource ? 'merge-target' : ''].filter(Boolean).join(' ');
  const check = t.done ? '✓' : '';

  let secs = t.total_seconds || 0;
  if (isActive && tickStart) secs += (Date.now() - tickStart) / 1000;
  const timeStr = secs > 30 ? fmtSeconds(secs) : '';

  // Deadline display
  let deadlineStr = '';
  if (t.deadline) {
    const now = new Date(); now.setHours(0,0,0,0);
    const dl = new Date(t.deadline); dl.setHours(0,0,0,0);
    const days = Math.round((dl - now) / 86400000);
    if (days < 0) deadlineStr = `<span class="task-time" style="color:var(--danger)">${Math.abs(days)}d überfällig</span>`;
    else if (days === 0) deadlineStr = `<span class="task-time" style="color:var(--danger)">heute fällig</span>`;
    else if (days <= 3) deadlineStr = `<span class="task-time" style="color:var(--warn)">${days}d</span>`;
    else deadlineStr = `<span class="task-time">${days}d</span>`;
  }

  return `
  <div class="task-item ${cls}" data-id="${t.id}">
    <div class="task-check" data-check="${t.id}">${check}</div>
    <div class="task-body">
      <div class="task-title"><span style="color:var(--muted);font-family:var(--font-mono);font-size:10px;margin-right:4px">${escapeHtml(t.sequence_name || '#'+t.id)}</span>${escapeHtml(t.title)}</div>
      <div class="task-meta">
        ${t.ticket_ref ? `<span class="ticket-badge">${escapeHtml(t.ticket_ref)}</span>` : ''}
        ${t.odoo_task_label ? `<span class="odoo-badge" data-odoo-open="${t.odoo_task_id}" data-odoo-link="${t.id}" title="Odoo: ${escapeHtml(t.odoo_task_label)} (Klick=öffnen, Lang=ändern)">${escapeHtml(t.odoo_task_label)}</span>` : ''}
        ${renderBudgetBadge(t.odoo_task_id)}
        ${t.odoo_stage ? `<span class="stage-badge">${escapeHtml(t.odoo_stage)}</span>` : ''}
        ${t.git_branch ? `<span class="git-badge" data-proj="${t.id}" title="${escapeHtml(t.git_branch)}">${escapeHtml(t.git_branch)}</span>` : ''}
        ${t.unsynced_count > 0 ? `<span class="unsynced-badge" data-upload="${t.id}" title="${t.unsynced_count} Timeslot(s) nicht hochgeladen${!t.odoo_task_id ? ' – Odoo Task verknüpfen' : ' – klicken zum Hochladen'}" style="cursor:pointer">${t.unsynced_count}×</span>` : ''}
        ${deadlineStr}
        ${timeStr ? `<span class="task-time">${timeStr}</span>` : ''}
      </div>
    </div>
    <div class="task-actions">
      ${(() => {
        const today = new Date(); today.setHours(0,0,0,0);
        const td = t.date ? new Date(t.date) : null;
        if (td) td.setHours(0,0,0,0);
        return (td && td < today) ? `<button class="task-action-btn" data-move-today="${t.id}" title="Auf heute verschieben und aus dem Archiv holen">↑ <span class="lbl">Heute</span></button>` : '';
      })()}
      <button class="task-action-btn prio${t.priority ? ' prio-on' : ''}" data-prio="${t.id}" title="${t.priority ? 'Priorität entfernen – Stern abwählen' : 'Als wichtig markieren (nach oben sortieren)'}">${t.priority ? '⭐' : '☆'} <span class="lbl">Prio</span></button>
      ${!t.done ? `<button class="task-action-btn play" data-play="${t.id}" title="${isActive ? 'Zeiterfassung läuft – klicken zum Pausieren' : 'Zeiterfassung für diese Aufgabe starten'}">${isActive ? '⏸' : '▶'} <span class="lbl">${isActive ? 'Läuft' : 'Start'}</span></button>` : ''}
      ${t.ticket_url ? `<button class="task-action-btn" data-open-ticket="${t.id}" title="Verknüpftes Ticket im Browser öffnen">🎫 <span class="lbl">Ticket</span></button>` : ''}
      ${t.vscode_path ? `<button class="task-action-btn" data-commits="${t.id}" title="Git-Commits dieses Arbeitsverzeichnisses anzeigen">📋 <span class="lbl">Commits</span></button>` : ''}
      <button class="task-action-btn" data-link="${t.id}" title="Mit einer Odoo-Aufgabe verknüpfen">🔗 <span class="lbl">Odoo</span></button>
      <button class="task-action-btn" data-merge="${t.id}" title="Mit einer anderen Aufgabe zusammenführen">⊕ <span class="lbl">Merge</span></button>
      ${t.archived ? `<button class="task-action-btn" data-unarchive="${t.id}" title="Aufgabe aus dem Archiv zurückholen">↩ <span class="lbl">Entarchiv.</span></button>` : `<button class="task-action-btn del" data-del="${t.id}" title="Aufgabe archivieren (ausblenden)">🗑 <span class="lbl">Archiv</span></button>`}
    </div>
  </div>`;
}

function escapeHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ── Letzte 10 Tage (Odoo Timesheet Summe) ──────────────────────────────────
const DAYS_STRIP_COUNT = 10;
const WD_DE = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const MONTH_DE = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];

function fmtHours(h) {
  if (!h) return '0';
  const s = h.toFixed(1).replace('.', ',');
  return s.endsWith(',0') ? s.slice(0, -2) : s;
}

async function loadDaysStrip() {
  const strip = document.getElementById('days-strip');
  if (!strip) return;
  strip.classList.add('loading');
  try {
    const data = await window.dt.lastDaysTimesheet(DAYS_STRIP_COUNT);
    if (!Array.isArray(data) || !data.length) {
      strip.innerHTML = '<div style="flex:1;text-align:center;font-size:9px;color:var(--muted);padding:4px">Keine Daten</div>';
      return;
    }
    const todayIso = new Date().toISOString().slice(0, 10);
    let lastMonth = null;
    let html = '';
    for (const d of data) {
      const dt = new Date(d.date + 'T00:00:00');
      const wd = dt.getDay();
      const mon = dt.getMonth();
      if (mon !== lastMonth) {
        html += `<div class="ds-month">${MONTH_DE[mon]}</div>`;
        lastMonth = mon;
      }
      const cls = ['ds-day'];
      if (d.date === todayIso) cls.push('today');
      if (wd === 0 || wd === 6) cls.push('weekend');
      const hCls = (d.hours > 0) ? '' : 'zero';
      const buckets = Array.isArray(d.buckets) ? d.buckets : [];
      const bucketsHtml = buckets.map(b => {
        const safeColor = String(b.color || '').replace(/[^#0-9a-zA-Z]/g, '');
        const safeLabel = String(b.label || '').replace(/"/g, '&quot;');
        return `<span class="ds-bucket" style="color:${safeColor}" title="${safeLabel}">${fmtHours(b.hours)}h</span>`;
      }).join('');
      html += `<div class="${cls.join(' ')}" data-date="${d.date}" title="${d.date} — klick: in Odoo öffnen">
        <div class="ds-wd">${WD_DE[wd]}</div>
        <div class="ds-date">${dt.getDate()}</div>
        <div class="ds-hours ${hCls}">${fmtHours(d.hours)}h</div>
        <div class="ds-buckets">${bucketsHtml}</div>
      </div>`;
    }
    strip.innerHTML = html;
  } catch (e) {
    console.error('[loadDaysStrip]', e);
  } finally {
    strip.classList.remove('loading');
  }
}

document.getElementById('days-strip')?.addEventListener('click', (e) => {
  const dayEl = e.target.closest('.ds-day');
  if (dayEl && dayEl.dataset.date) {
    window.dt.openTimesheetDay(dayEl.dataset.date);
    return;
  }
  loadDaysStrip();
});

// ── Data loading ───────────────────────────────────────────────────────────
async function load() {
  try {
  console.log('[load] Aufgerufen');
  try {
    const cfg = await window.dt.getConfig();
    if (cfg && typeof cfg.status_filter_order === 'string' && cfg.status_filter_order.trim()) {
      statusFilterOrder = cfg.status_filter_order.split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
    }
  } catch {}
  const res = await window.dt.todayTasks({ includeArchived: filterArchive });
  console.log('[load] Tasks erhalten:', res.tasks?.length);
  tasks = res.tasks;
  activeTaskId = res.activeTaskId;
  activeSlotId = res.activeSlotId;

  // Merge in unsynced tasks from previous days
  const unsyncedRes = await window.dt.unsyncedTasks();
  const todayIds = new Set(tasks.map(t => t.id));
  for (const t of unsyncedRes.tasks) {
    if (!todayIds.has(t.id)) tasks.push(t);
  }

  // estimate tick start from running_since
  const activeTask = tasks.find(t => t.id === activeTaskId);
  if (activeTask && activeTask.running_since) {
    const started = new Date(activeTask.running_since.replace(' ', 'T'));
    const runningMs = Date.now() - started.getTime();
    tickStart = Date.now() - runningMs;
    // total_seconds from DB already includes running time via COALESCE —
    // subtract it so tick delta can be cleanly added back in render/onTick
    activeTask.total_seconds = (activeTask.total_seconds || 0) - runningMs / 1000;
    elapsedBase = activeTask.total_seconds;
  } else {
    tickStart = null;
    elapsedBase = 0;
  }

  renderTasks();
  updateClock();
  if (typeof updateFilterLabel === 'function') updateFilterLabel();
  scheduleBudgetFetch();
  } catch(e) { console.error('[load] FEHLER:', e); document.title = 'ERR: ' + e.message; }
}

// ── Budget (allocated/effective hours from Odoo standard fields) ───────────
function scheduleBudgetFetch() {
  if (budgetFetchTimer) clearTimeout(budgetFetchTimer);
  budgetFetchTimer = setTimeout(fetchTaskBudgets, 150);
}

async function fetchTaskBudgets() {
  budgetFetchTimer = null;
  const ids = [...new Set(tasks.filter(t => t.odoo_task_id).map(t => t.odoo_task_id))];
  if (!ids.length) return;
  try {
    const res = await window.dt.getTaskBudgets(ids);
    if (!res || !res.ok) return;
    budgetCache = { ...budgetCache, ...res.budgets };
    renderTasks();
  } catch (e) {
    console.warn('[budget] fetch failed', e);
  }
}

function fmtHours(h) {
  if (!isFinite(h)) return '0h';
  const abs = Math.abs(h);
  if (abs < 0.1) return '0h';
  if (abs < 10) return h.toFixed(1).replace(/\.0$/, '') + 'h';
  return Math.round(h) + 'h';
}

function renderBudgetBadge(odooTaskId) {
  if (!odooTaskId) return '';
  const b = budgetCache[odooTaskId];
  if (!b || !b.allocated) return ''; // no budget set in Odoo
  const cls = b.remaining < 0 ? 'over' : (b.progress >= 80 ? 'near' : 'under');
  const sign = b.remaining < 0 ? '+' : '';
  const overunder = b.remaining < 0
    ? `${sign}${fmtHours(-b.remaining)}`
    : `−${fmtHours(b.remaining)}`;
  const title = `Budget ${fmtHours(b.allocated)} · Ist ${fmtHours(b.effective)} · ${Math.round(b.progress)}%`;
  return `<span class="budget-badge ${cls}" title="${title}">${fmtHours(b.effective)}/${fmtHours(b.allocated)} ${overunder}</span>`;
}

// ── Clock ──────────────────────────────────────────────────────────────────
function updateClock() {
  const clock = document.getElementById('active-clock');
  if (activeTaskId && tickStart) {
    const secs = (Date.now() - tickStart) / 1000;
    clock.textContent = fmtSeconds(secs);
    clock.classList.add('visible');
  } else {
    clock.classList.remove('visible');
  }
  updateMiniBar();
}

function updateMiniBar() {
  const dot = document.getElementById('mini-dot');
  const name = document.getElementById('mini-task-name');
  const timer = document.getElementById('mini-timer');
  if (activeTaskId && tickStart) {
    const task = tasks.find(t => t.id === activeTaskId);
    dot.classList.remove('idle');
    name.classList.remove('idle');
    name.textContent = task ? task.title : 'Task…';
    const totalSecs = (task?.total_seconds || 0) + (Date.now() - tickStart) / 1000;
    timer.textContent = fmtSeconds(totalSecs);
  } else {
    dot.classList.add('idle');
    name.classList.add('idle');
    name.textContent = 'Kein aktiver Task';
    timer.textContent = '';
  }
}

window.dt.onTick(({ now }) => {
  if (!activeTaskId || !tickStart) return;
  // update clock
  updateClock();
  // update task time in-place without full re-render
  const item = document.querySelector(`.task-item.active`);
  if (item) {
    const secs = (activeTaskId ? (tasks.find(t=>t.id===activeTaskId)?.total_seconds||0) : 0)
               + (tickStart ? (now - tickStart)/1000 : 0);
    const timeEl = item.querySelector('.task-time');
    if (timeEl) timeEl.textContent = fmtSeconds(secs);
    else {
      const meta = item.querySelector('.task-meta');
      if (meta) {
        const s = document.createElement('span');
        s.className = 'task-time';
        s.textContent = fmtSeconds(secs);
        meta.appendChild(s);
      }
    }
  }
  // footer
  const totalSec = tasks.reduce((s, t) => s + (t.total_seconds || 0), 0);
  const extra = tickStart ? (now - tickStart) / 1000 : 0;
  document.getElementById('total-time').textContent = fmtSeconds(totalSec + extra);
});

// ── Event delegation ───────────────────────────────────────────────────────
document.getElementById('task-list').addEventListener('click', async (e) => {
  const collapseEl = e.target.closest('[data-proj-collapse]');
  if (collapseEl) {
    e.stopPropagation();
    toggleProjectCollapse(collapseEl.dataset.projCollapse);
    renderTasks();
    return;
  }
  const checkEl = e.target.closest('[data-check]');
  const playEl = e.target.closest('[data-play]');
  const prioEl = e.target.closest('[data-prio]');
  const delEl = e.target.closest('[data-del]');
  const unarchiveEl = e.target.closest('[data-unarchive]');
  const moveTodayEl = e.target.closest('[data-move-today]');
  const itemEl = e.target.closest('.task-item');

  if (moveTodayEl) {
    e.stopPropagation();
    const id = +moveTodayEl.dataset.moveToday;
    const res = await window.dt.moveTaskToToday(id);
    if (res && res.ok === false) {
      showToast('Verschieben fehlgeschlagen: ' + (res.error || 'unbekannt'), '#e05c5c');
      return;
    }
    archiveResults = archiveResults.filter(r => r.id !== id);
    await load();
    showToast('↑ auf heute verschoben');
    return;
  }

  if (prioEl) {
    e.stopPropagation();
    const id = +prioEl.dataset.prio;
    const task = tasks.find(t => t.id === id);
    await window.dt.setPriority({ id, priority: task?.priority ? 0 : 1 });
    await load();
    return;
  }

  if (checkEl) {
    const id = +checkEl.dataset.check;
    const task = tasks.find(t => t.id === id);
    if (task.done) {
      await window.dt.undoneTask(id);
    } else {
      const res = await window.dt.doneTask(id);
      if (res && res.deleted && res.snapshot) {
        showUndoToast(`"${res.snapshot.title || 'Task'}" erledigt`, async () => {
          await window.dt.restoreTask(res.snapshot);
          await load();
        });
      }
    }
    await load();
    return;
  }

  if (playEl) {
    const id = +playEl.dataset.play;
    if (id === activeTaskId) {
      const res = await window.dt.stopTimer();
      tickStart = null;
      if (res.odoo?.ok) showToast('✓ Odoo sync: ' + (res.odoo.lineId || 'ok'));
      else if (res.odoo?.error && res.odoo.error !== 'Odoo not configured') showToast('Odoo: ' + res.odoo.error, '#e05c5c');
    } else {
      const res = await window.dt.startTimer(id);
      if (res.ok) { tickStart = Date.now(); }
    }
    await load();
    return;
  }

  if (delEl) {
    const id = +delEl.dataset.del;
    if (confirm('Task archivieren?')) {
      await window.dt.deleteTask(id);
      await load();
    }
    return;
  }

  if (unarchiveEl) {
    const id = +unarchiveEl.dataset.unarchive;
    await window.dt.unarchiveTask(id);
    await load();
    showToast('↩ aus Archiv geholt');
    return;
  }

  // Click on Odoo search result → create local task + link
  const odooEl = e.target.closest('[data-odoo-create]');
  if (odooEl) {
    const odooTaskId = +odooEl.dataset.odooCreate;
    const name = odooEl.dataset.odooName;
    const projId = +odooEl.dataset.odooProjId;
    const projName = odooEl.dataset.odooProjName;
    const deadline = odooEl.dataset.odooDeadline;
    const seqName = odooEl.dataset.odooSeq;
    const branch = odooEl.dataset.odooBranch;
    const repo = odooEl.dataset.odooRepo;
    const label = `${projName} / ${name}`;

    const res = await window.dt.addTask({
      title: name,
      odoo_task_id: odooTaskId,
      odoo_project_id: projId,
      odoo_project_name: projName,
      odoo_task_name: name,
      odoo_task_sequence: seqName,
    });
    if (res.id) {
      // Link + set extra fields
      await window.dt.linkOdooTask({
        taskId: res.id,
        odooTaskId,
        odooProjectId: projId,
        odooTaskLabel: label,
        gitBranch: branch,
        gitRepo: repo,
        deadline,
      });
      showToast('Task erstellt + verknüpft');
      document.getElementById('task-input').value = '';
      searchQuery = '';
      odooSearchResults = [];
      document.getElementById('add-row2').style.display = 'none';
      await load();
    }
    return;
  }
});

document.getElementById('stop-btn').addEventListener('click', async () => {
  const res = await window.dt.stopTimer();
  tickStart = null;
  if (res.odoo?.ok) showToast('✓ Odoo sync: ' + (res.odoo.lineId || 'ok'));
  else if (res.odoo?.error && res.odoo.error !== 'Odoo not configured') showToast('Odoo: ' + res.odoo.error, '#e05c5c');
  await load();
});

// Quick add - project picker with search
let selectedProject = null; // { id, name }
let projDropIdx = -1;
let projDropItems = [];
let projSearchTimer = null;

async function showProjectDropdown(query) {
  const dd = document.getElementById('project-dropdown');
  let html = '';
  const q = (query || '').trim();

  // Recent projects (gefiltert, nur wenn kein Query oder Query passt)
  const recent = await window.dt.recentProjects();
  const filtered = q
    ? recent.filter(p => p.name.toLowerCase().includes(q.toLowerCase()))
    : recent;

  if (filtered.length > 0) {
    html += '<div class="proj-drop-sep">Letzte</div>';
    for (const p of filtered) {
      html += `<div class="proj-drop-item" data-pid="${p.id}" data-pname="${escapeHtml(p.name)}">${escapeHtml(p.name)}</div>`;
    }
  }

  // Odoo search if query is >= 2 chars (parallel: Projekte + Tasks)
  if (q.length >= 2) {
    const [projResults, taskRes] = await Promise.all([
      window.dt.searchProjects(q),
      window.dt.odooSearchTasks(q),
    ]);
    const recentIds = new Set(filtered.map(p => p.id));
    const extra = (projResults || []).filter(p => !recentIds.has(p.id));
    if (extra.length > 0) {
      html += '<div class="proj-drop-sep">Projekte</div>';
      for (const p of extra) {
        html += `<div class="proj-drop-item" data-pid="${p.id}" data-pname="${escapeHtml(p.name)}">${escapeHtml(p.name)}</div>`;
      }
    }
    const tasks = (taskRes && taskRes.ok && taskRes.tasks) ? taskRes.tasks : [];
    if (tasks.length > 0) {
      html += '<div class="proj-drop-sep">Tasks</div>';
      for (const t of tasks) {
        const seq = t.sequence_name ? `<span style="color:var(--accent2);font-size:10px;margin-right:4px">${escapeHtml(t.sequence_name)}</span>` : '';
        html += `<div class="proj-drop-item" data-tid="${t.id}" data-tname="${escapeHtml(t.name)}" data-tseq="${escapeHtml(t.sequence_name || '')}" data-task-pid="${t.project_id}" data-task-pname="${escapeHtml(t.project_name || '')}">
          ${seq}${escapeHtml(t.name)}
          <div style="font-size:10px;color:var(--muted)">${escapeHtml(t.project_name || '')}</div>
        </div>`;
      }
    }
  }

  if (!html) html = '<div class="proj-drop-item" style="color:var(--muted)">Keine Ergebnisse</div>';
  dd.innerHTML = html;
  dd.style.display = 'block';
  projDropItems = [...dd.querySelectorAll('[data-pid], [data-tid]')];
  projDropIdx = -1;
}

// Odoo Task picker within selected project
async function showOdooTaskDropdown(query) {
  if (!selectedProject) return;
  const dd = document.getElementById('odoo-task-dropdown');
  dd.innerHTML = '<div class="proj-drop-item" style="color:var(--muted)">Suche…</div>';
  dd.style.display = 'block';
  const q = (query || '').trim();
  const [tasks, projectsRaw] = await Promise.all([
    window.dt.searchTasksInProject({ projectId: selectedProject.id, query: q }),
    q.length >= 2 ? window.dt.searchProjects(q) : Promise.resolve([]),
  ]);
  let html = '';

  // Projekt-Auswahl direkt unter dem Suchbegriff – Klick wechselt Projekt, "+" legt Task "query" im Projekt an
  if (q.length >= 2) {
    const projects = (projectsRaw || []).slice();
    if (!projects.some(p => p.id === selectedProject.id)) {
      projects.unshift({ id: selectedProject.id, name: selectedProject.name });
    }
    if (projects.length > 0) {
      html += '<div class="proj-drop-sep">Projekt · + legt "' + escapeHtml(q) + '" an</div>';
      for (const p of projects) {
        const isCurrent = p.id === selectedProject.id;
        html += `<div class="proj-drop-row" style="display:flex;align-items:stretch;border-bottom:1px solid var(--line)">
          <div class="proj-drop-item" data-switch-pid="${p.id}" data-switch-pname="${escapeHtml(p.name)}" style="flex:1;border:none;color:${isCurrent ? 'var(--accent)' : 'var(--text)'}">${escapeHtml(p.name)}${isCurrent ? ' <span style="color:var(--muted);font-size:10px">(aktuell)</span>' : ''}</div>
          <div class="proj-drop-item proj-create-btn" data-create-in-pid="${p.id}" data-create-in-pname="${escapeHtml(p.name)}" data-create-name="${escapeHtml(q)}" title="Task hier anlegen" style="flex:0 0 auto;padding:6px 12px;border:none;border-left:1px solid var(--line);color:var(--accent);font-weight:600;cursor:pointer">+</div>
        </div>`;
      }
    }
  }

  // Tasks im aktuellen Projekt
  if (tasks.length > 0) {
    html += '<div class="proj-drop-sep">Tasks in ' + escapeHtml(selectedProject.name) + '</div>';
    for (const t of tasks) {
      const seq = t.sequence_name ? `<span style="color:var(--muted)">${escapeHtml(t.sequence_name)}</span> ` : '';
      html += `<div class="proj-drop-item" data-tid="${t.id}" data-tname="${escapeHtml(t.name)}" data-tseq="${escapeHtml(t.sequence_name || '')}">${seq}${escapeHtml(t.name)}</div>`;
    }
  }

  if (!html) html = '<div class="proj-drop-item" style="color:var(--muted)">Task-Name eingeben…</div>';
  dd.innerHTML = html;
  otDropItems = [...dd.querySelectorAll('[data-tid], [data-switch-pid]')];
  otDropIdx = -1;
}

async function addTaskFromInput() {
  const inp = document.getElementById('task-input');
  const title = inp.value.trim();
  if (!title) { inp.focus(); return; }
  const deadlineInput = document.getElementById('deadline-input');
  const deadline = deadlineInput.value;
  if (!deadline) {
    deadlineInput.style.borderColor = 'var(--danger)';
    deadlineInput.focus();
    showToast('Deadline ist Pflicht', '#e05c5c');
    return;
  }
  deadlineInput.style.borderColor = '';
  const ticket = document.getElementById('ticket-input').value.trim();
  const proj = getSelectedProject();
  const addRes = await window.dt.addTask({ title, ticket_ref: ticket, deadline, ...proj });
  if (addRes?.id) justAddedIds.add(addRes.id);
  if (addRes?.odooCreateError) {
    showToast('Odoo-Task nicht angelegt: ' + addRes.odooCreateError, '#e05c5c');
  } else if (proj.odoo_project_id && !proj.odoo_task_id && addRes?.odooTaskId) {
    showToast('Odoo-Task erstellt + verknüpft');
  }
  inp.value = '';
  document.getElementById('ticket-input').value = '';
  deadlineInput.value = '';
  document.getElementById('project-input').value = '';
  document.getElementById('project-input').style.color = 'var(--text)';
  selectedProject = null;
  document.getElementById('add-row2').style.display = 'none';
  document.getElementById('odoo-task-picker').style.display = 'none';
  document.getElementById('odoo-task-input').value = '';
  selectedOdooTask = null;
  searchQuery = '';
  inp.focus();
  await load();
}

// Odoo Anwesenheit (Stempeln) — Lampe grün=eingestempelt, rot=ausgestempelt, grau=unbekannt
const attBtn = document.getElementById('attendance-btn');
const attLamp = document.getElementById('attendance-lamp');
let attState = null; // 'checked_in' | 'checked_out' | null
let attBusy = false;
function paintAttLamp() {
  let color = '#666', glow = 'none', title = 'Stempeln (Status unbekannt)';
  if (attState === 'checked_in') {
    color = '#3dd68c'; glow = '0 0 6px rgba(61,214,140,.7)'; title = 'Eingestempelt — klicken zum Ausstempeln';
  } else if (attState === 'checked_out') {
    color = '#e05c5c'; glow = '0 0 6px rgba(224,92,92,.6)'; title = 'Ausgestempelt — klicken zum Einstempeln';
  }
  if (attBusy) { color = '#f5a623'; glow = '0 0 6px rgba(245,166,35,.6)'; }
  attLamp.style.background = color;
  attLamp.style.boxShadow = glow + (glow === 'none' ? '' : ', 0 0 0 1px rgba(0,0,0,.3) inset');
  attBtn.title = attBusy ? 'Stempel-Vorgang läuft…' : title;
}
async function refreshAttendance() {
  try {
    const r = await window.dt.attendanceStatus();
    attState = r && r.ok ? r.state : null;
  } catch { attState = null; }
  paintAttLamp();
}
let attLastError = '';
attBtn.addEventListener('click', async (e) => {
  e.stopPropagation();
  if (attBusy) return;
  attBusy = true; attLastError = ''; paintAttLamp();
  try {
    const r = await window.dt.attendanceToggle();
    if (r && r.ok) { attState = r.state; }
    else if (r && r.error) { attLastError = r.error; }
  } catch (err) { attLastError = err && err.message || String(err); }
  attBusy = false; paintAttLamp();
  if (attLastError) attBtn.title = 'Fehler: ' + attLastError;
});

document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === ',') { e.preventDefault(); window.dt.openSettings(); }

  // Done History mit Escape schliessen (Overlay ohne eigenes Input-Feld)
  if (e.key === 'Escape') {
    const dh = document.getElementById('done-history-overlay');
    if (dh && dh.classList.contains('visible')) { dh.classList.remove('visible'); return; }
  }

  const wrap = document.getElementById('task-list-wrap');
  // Ctrl+B / Ctrl+F: page up / down in task list
  if (e.ctrlKey && e.key === 'b') { e.preventDefault(); wrap.scrollBy({ top: -wrap.clientHeight * 0.8, behavior: 'smooth' }); return; }
  if (e.ctrlKey && e.key === 'f') { e.preventDefault(); wrap.scrollBy({ top: wrap.clientHeight * 0.8, behavior: 'smooth' }); return; }

  // Arrow navigation + Enter only when not typing in an input
  const tag = document.activeElement?.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  const noOverlay = !document.querySelector('#edit-overlay.visible, #odoo-search-overlay.visible, #project-overlay.visible, #commits-overlay.visible, #team-overlay.visible, #done-history-overlay.visible, #dayview-overlay.visible');
  if (!noOverlay) return;

  if (e.key === 'ArrowDown') { e.preventDefault(); moveKbdFocus(1); return; }
  if (e.key === 'ArrowUp') { e.preventDefault(); moveKbdFocus(-1); return; }
  if (e.key === 'Enter' && kbdSelectedId) {
    e.preventDefault();
    window.dt.openTaskWindow(kbdSelectedId);
    return;
  }
});

      const sel = odooSelectedProject && odooSelectedProject.id === p.id;
      html += `<div class="odoo-result-item odoo-select-row${sel ? ' selected' : ''}" data-select-pid="${p.id}" data-select-pname="${escapeHtml(p.name)}" style="display:flex;align-items:center;gap:8px;cursor:pointer">
        <div style="flex:0 0 auto;color:var(--accent);font-weight:700;font-family:var(--font-mono);font-size:14px;padding:0 4px">${sel ? '●' : '○'}</div>
        <div style="flex:1;color:var(--text);font-family:var(--font-mono);font-size:12px">${escapeHtml(p.name)}</div>
      </div>`;
      if (sel) {
        html += `<div class="odoo-result-item odoo-create-row" data-do-create-pid="${p.id}" data-do-create-pname="${escapeHtml(p.name)}" style="display:flex;align-items:center;gap:8px;cursor:pointer;padding-left:26px">
          <div style="flex:0 0 auto;color:var(--accent);font-weight:700;font-family:var(--font-mono);font-size:14px">+</div>
          <div style="flex:1;color:var(--accent);font-size:12px">Neuen Odoo-Task "${escapeHtml(createName)}" hier anlegen</div>
        </div>`;
      }
    }
  }

  if (odooResults.length > 0 && query.length >= 2 && odooProjectResults.length > 0) {
    html += `<div style="font-size:10px;color:var(--muted);padding:10px 12px 4px;text-transform:uppercase;letter-spacing:.08em;border-top:1px solid var(--line);margin-top:4px">Bestehende Tasks</div>`;
  }
  html += odooResults.map((t, i) => {
    const ticketNo = t.sequence_name || '';
    return `
    <div class="odoo-result-item ${i === odooSelectedIdx ? 'selected' : ''}" data-odoo-idx="${i}">
      <div class="odoo-result-project">${escapeHtml(t.project_name)}${ticketNo ? `<span class="odoo-result-no">${escapeHtml(ticketNo)}</span>` : ''}</div>
      <div class="odoo-result-name">${ticketNo ? `<span class="odoo-result-ticket">${escapeHtml(ticketNo)}</span> ` : ''}${escapeHtml(t.name)}</div>
    </div>
  `;
  }).join('');

  if (!html) {
    html = '<div style="color:var(--muted);font-size:12px;padding:12px;text-align:center">Keine Ergebnisse</div>';
  }
  container.innerHTML = html;
}

async function createOdooTaskInProject(projectId, projectName) {
  if (!linkingTaskId) return;
  const query = document.getElementById('odoo-search-input').value.trim();
  const linkingTask = tasks.find(t => t.id === linkingTaskId);
  const taskName = (linkingTask?.title || '').trim() || query;
  if (!taskName) { showToast('Kein Task-Titel', '#e05c5c'); return; }
  const status = document.getElementById('odoo-search-status');
  status.textContent = 'Erstelle…';
  const res = await window.dt.createOdooTask({ projectId, name: taskName });
  if (!res.ok) { showToast('Fehler: ' + res.error, '#e05c5c'); status.textContent = ''; return; }
  const label = `${projectName} / ${taskName}`;
  const linkRes = await window.dt.linkOdooTask({
    taskId: linkingTaskId,
    odooTaskId: res.taskId,
    odooProjectId: projectId,
    odooTaskLabel: label,
  });
  closeOdooSearch();
  if (linkRes.synced > 0) showToast(`Erstellt + verknüpft + ${linkRes.synced} Zeitslot${linkRes.synced > 1 ? 's' : ''} nachgebucht`);
  else showToast('Odoo Task erstellt + verknüpft');
  await load();
}

async function doOdooSearch(query) {
  const status = document.getElementById('odoo-search-status');
  odooSelectedProject = null;
  if (!query || query.length < 2) {
    status.textContent = 'Mindestens 2 Zeichen…';
    odooResults = [];
    odooProjectResults = [];
    renderOdooResults();
    return;
  }
  status.textContent = 'Suche…';
  const [res, projects] = await Promise.all([
    window.dt.odooSearchTasks(query),
    window.dt.searchProjects(query),
  ]);
  if (!res.ok) {
    status.textContent = 'Fehler: ' + res.error;
    odooResults = [];
  } else {
    odooResults = res.tasks;
    odooSelectedIdx = odooResults.length > 0 ? 0 : -1;
    status.textContent = `${odooResults.length} Task${odooResults.length !== 1 ? 's' : ''} · ${(projects || []).length} Projekt${(projects || []).length !== 1 ? 'e' : ''}`;
  }
  odooProjectResults = projects || [];
  renderOdooResults();
}

async function selectOdooResult(idx) {
  const t = odooResults[idx];
  if (!t || !linkingTaskId) return;
  const ticketNo = t.sequence_name || '';
  const label = `${t.project_name} / ${t.name}${ticketNo ? ' ' + ticketNo : ''}`;
  const res = await window.dt.linkOdooTask({
    taskId: linkingTaskId,
    odooTaskId: t.id,
    odooProjectId: t.project_id,
    odooTaskLabel: label,
    gitBranch: t.branch_name || '',
    gitRepo: t.repo || '',
    deadline: t.date_deadline || '',
  });
  closeOdooSearch();
  if (res.synced > 0) {
    showToast(`Verknüpft + ${res.synced} Zeitslot${res.synced > 1 ? 's' : ''} nachgebucht`);
  } else {
    showToast('Odoo Task verknüpft');
  }
  if (res.failed > 0) {
    showToast(`${res.failed} Slot${res.failed > 1 ? 's' : ''} fehlgeschlagen`, '#e05c5c');
  }
  await load();
}

document.getElementById('odoo-search-input').addEventListener('input', (e) => {
  clearTimeout(odooSearchTimer);
  odooSearchTimer = setTimeout(() => doOdooSearch(e.target.value.trim()), 300);
});

document.getElementById('odoo-search-input').addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeOdooSearch(); return; }
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (odooSelectedIdx < odooResults.length - 1) { odooSelectedIdx++; renderOdooResults(); }
    return;
  }
  if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (odooSelectedIdx > 0) { odooSelectedIdx--; renderOdooResults(); }
    return;
  }
  if (e.key === 'Enter' && odooSelectedIdx >= 0) {
    e.preventDefault();
    selectOdooResult(odooSelectedIdx);
  }
});

document.getElementById('odoo-search-results').addEventListener('click', (e) => {
  const createRow = e.target.closest('[data-do-create-pid]');
  if (createRow) {
    createOdooTaskInProject(+createRow.dataset.doCreatePid, createRow.dataset.doCreatePname);
    return;
  }
  const selRow = e.target.closest('[data-select-pid]');
  if (selRow) {
    const pid = +selRow.dataset.selectPid;
    odooSelectedProject = (odooSelectedProject && odooSelectedProject.id === pid)
      ? null : { id: pid, name: selRow.dataset.selectPname };
    renderOdooResults();
    return;
  }
  const item = e.target.closest('[data-odoo-idx]');
  if (item) selectOdooResult(+item.dataset.odooIdx);
});

document.getElementById('odoo-search-close').addEventListener('click', closeOdooSearch);

document.getElementById('odoo-unlink-btn').addEventListener('click', async () => {

  await window.dt.unlinkOdooTask(linkingTaskId);

  await load();
});

// Handle link button + odoo badge + project clicks in task list (capturing phase)
document.getElementById('task-list').addEventListener('click', async (e) => {
  const linkEl = e.target.closest('[data-link]');
  if (linkEl) { e.stopPropagation(); openOdooSearch(+linkEl.dataset.link); return; }
  const odooBadge = e.target.closest('[data-odoo-open]');
  if (odooBadge) {
    e.stopPropagation();
    // Open Odoo task in browser
    window.dt.openOdooTask(+odooBadge.dataset.odooOpen);
    return;
  }
  const projEl = e.target.closest('[data-proj]');
  if (projEl) { e.stopPropagation(); openProjectOverlay(+projEl.dataset.proj); return; }
  const vsEl = e.target.closest('[data-open-vscode]');
  if (vsEl) {
    e.stopPropagation();
    window.dt.openVscode(+vsEl.dataset.openVscode).then(r => {
      if (r.branchMsg) showToast(r.branchMsg, r.branchMsg.includes('fehl') || r.branchMsg.includes('dirty') ? '#f5a623' : '#3dd68c');
    });
    return;
  }
  const vsDirEl = e.target.closest('[data-open-vscode-dir]');
  if (vsDirEl) {
    e.stopPropagation();
    window.dt.openWorkingDir(+vsDirEl.dataset.openVscodeDir).then(r => {
      if (r && !r.ok) showToast(r.error || 'Fehler', '#e05c5c');
    });
    return;
  }
  const ticketEl = e.target.closest('[data-open-ticket]');
  if (ticketEl) { e.stopPropagation(); window.dt.openTicket(+ticketEl.dataset.openTicket); return; }
  const uploadEl = e.target.closest('[data-upload]');
  if (uploadEl) {
    e.stopPropagation();
    const tid = +uploadEl.dataset.upload;
    const task = tasks.find(x => x.id === tid);
    if (task && !task.odoo_task_id) {
      // No Odoo link → open link dialog
      openOdooSearch(tid);
      return;
    }
    uploadEl.style.opacity = '0.5';
    uploadEl.textContent = '⟳';
    const res = await window.dt.syncUnsynced(tid);
    if (res.ok) {
      showToast(`${res.synced} Slot${res.synced > 1 ? 's' : ''} hochgeladen`);
    } else {
      showToast(`${res.synced || 0} OK, ${res.failed || 0} Fehler`, '#e05c5c');
    }
    await load();
    loadDaysStrip();
    return;
  }
  const editEl = e.target.closest('[data-edit]');
  if (editEl) { e.stopPropagation(); window.dt.openTaskWindow(+editEl.dataset.edit); return; }
  const titleEl = e.target.closest('.task-title');
  if (titleEl) { const item = titleEl.closest('.task-item[data-id]'); if (item) { e.stopPropagation(); window.dt.openTaskWindow(+item.dataset.id); return; } }
  const commitsEl = e.target.closest('[data-commits]');
  if (commitsEl) { e.stopPropagation(); openCommitsOverlay(+commitsEl.dataset.commits); return; }
  const mergeEl = e.target.closest('[data-merge]');
  if (mergeEl) { e.stopPropagation(); startMerge(+mergeEl.dataset.merge); return; }
  // If in merge mode, clicking a task item is the merge target
  if (mergeSourceId) {
    const itemEl = e.target.closest('.task-item[data-id]');
    if (itemEl) { e.stopPropagation(); doMerge(+itemEl.dataset.id); return; }
  }
}, true);

let teamEmployees = [];
let selectedEmployeeId = null;

async function openTeamOverlay() {
  document.getElementById('team-overlay').classList.add('visible');
  document.getElementById('team-list').innerHTML = '<div style="color:var(--muted);font-size:11px;padding:8px">Lade Mitarbeiter…</div>';

function renderTeamList() {
  document.getElementById('team-list').innerHTML = teamEmployees.map(e =>
    `<div class="team-employee ${e.id === selectedEmployeeId ? 'selected' : ''}" data-eid="${e.id}">
      <span class="name ${e.isSelf ? 'self' : ''}">${escapeHtml(e.name)}${e.isSelf ? ' (ich)' : ''}</span>
