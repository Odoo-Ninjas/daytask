}

async function loadEmployeeTasks(userId) {
  selectedEmployeeId = userId;
  renderTeamList();
  document.getElementById('team-tasks').innerHTML = '<div style="color:var(--muted);font-size:11px;padding:8px">Lade Tasks…</div>';
  document.getElementById('team-summary').textContent = '';

  const res = await window.dt.getEmployeeTasks(userId);

  const summ = `${res.taskCount} Tasks`;
  const hours = res.totalAllocated > 0
    ? ` · ${Math.round(res.totalEffective)}h / ${Math.round(res.totalAllocated)}h (${Math.round(res.totalEffective / res.totalAllocated * 100)}%)`
    : res.totalEffective > 0 ? ` · ${Math.round(res.totalEffective)}h gebucht` : '';
  document.getElementById('team-summary').textContent = summ + hours;

  if (res.tasks.length === 0) {
    document.getElementById('team-tasks').innerHTML = '<div style="color:var(--muted);font-size:11px;padding:8px">Keine Tasks</div>';
    return;
  }

  document.getElementById('team-tasks').innerHTML = res.tasks.map(t => {
    const hrs = t.allocated > 0
      ? `<span class="team-task-hours">${Math.round(t.effective * 10) / 10}/${Math.round(t.allocated * 10) / 10}h</span>`
      : t.effective > 0 ? `<span class="team-task-hours">${Math.round(t.effective * 10) / 10}h</span>` : '';

      <span class="team-task-project">${escapeHtml(t.project)}</span>
      ${t.stage ? `<span class="team-task-stage">${escapeHtml(t.stage)}</span>` : ''}
      ${hrs}
      <div>${escapeHtml(t.sequence_name ? t.sequence_name + ' ' : '')}${escapeHtml(t.name)}</div>
    </div>`;
  }).join('');
}

// ── Tagesansicht ─────────────────────────────────────────────────────────
let dayViewDate = null;
let dayViewScanning = false;
const DV_WEEKDAYS = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];

function dvTodayISO() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function dvParseHours(v) {
  const n = parseFloat(String(v == null ? '' : v).replace(',', '.'));
  return Number.isNaN(n) ? 0 : Math.max(0, n);
}
function dvSetDate(iso) {
  dayViewDate = iso;
  const d = new Date(iso + 'T12:00:00');
  const el = document.getElementById('dayview-date');
  const isToday = iso === dvTodayISO();
  el.innerHTML = `${iso}<small>${DV_WEEKDAYS[d.getDay()]}${isToday ? ' · heute' : ''}</small>`;
}
function dvShift(delta) {
  const d = new Date(dayViewDate + 'T12:00:00');
  d.setDate(d.getDate() + delta);
  const p = n => String(n).padStart(2, '0');
  dvSetDate(`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`);
  loadDayView();
}
function dvStatus(msg, color) {
  const el = document.getElementById('dayview-status');
  el.textContent = msg || '';
  el.style.color = color || 'var(--muted)';
}

async function openDayView() {
  dvSetDate(dvTodayISO());
  document.getElementById('dayview-overlay').classList.add('visible');
  await loadDayView();
}
function closeDayView() {
  document.getElementById('dayview-overlay').classList.remove('visible');
}

async function loadDayView() {
  const list = document.getElementById('dayview-list');
  list.innerHTML = '<div style="color:var(--muted);font-size:11px;padding:8px">Lade aus Odoo…</div>';
  document.getElementById('dayview-total').textContent = '';
  let data;
  try { data = await window.dt.dayView(dayViewDate); }
  catch (e) { list.innerHTML = ''; dvStatus('Fehler: ' + e.message, 'var(--danger)'); return; }
  if (!data || !data.ok) {
    list.innerHTML = '';
    dvStatus(data && data.error ? data.error : 'Konnte nicht laden', 'var(--danger)');
    return;
  }
  if (!dayViewScanning) dvStatus('');
  renderDayView(data);
}

function renderDayView(data) {
  document.getElementById('dayview-total').textContent = `Summe: ${(data.totalHours || 0).toFixed(2)} h`;
  const list = document.getElementById('dayview-list');
  if (!data.projects.length) {
    list.innerHTML = '<div style="color:var(--muted);font-size:11px;padding:8px">Keine Zeiteinträge an diesem Tag. „🤖 Scan" lässt Claude die Work-Ordner auswerten.</div>';
    return;
  }
  list.innerHTML = data.projects.map(p => `
    <div class="dv-project">
      <div class="dv-project-head">
        <span class="h">${escapeHtml(p.project_name || '(ohne Projekt)')}</span>
        <span>${(p.hours || 0).toFixed(2)} h</span>
      </div>
      ${p.lines.map(l => `
        <div class="dv-line" data-id="${l.id}" data-pid="${p.project_id || ''}" data-tid="${l.task_id || ''}">
          <div class="dv-line-top">
            <span class="dv-task">${escapeHtml(l.task_name || '— (kein Task)')}</span>
            <input class="dv-hours" type="text" inputmode="decimal" value="${(l.unit_amount || 0).toFixed(2)}" title="Stunden (Enter/Tab speichert)">
            <button class="dv-del" title="Eintrag löschen">🗑</button>
          </div>
          <textarea class="dv-name" rows="2" placeholder="Beschreibung (account.analytic.line)…">${escapeHtml(l.name || '')}</textarea>
        </div>
      `).join('')}
      ${p.project_id ? `<button class="dv-add" data-pid="${p.project_id}">+ Eintrag</button>` : ''}
    </div>
  `).join('');
}

// Inline-Speichern direkt nach Odoo
async function dvSaveLine(row) {
  const id = row.dataset.id;
  const hours = dvParseHours(row.querySelector('.dv-hours').value);
  const name = row.querySelector('.dv-name').value;
  const res = await window.dt.dayViewUpsertLine({ id: id || undefined, unit_amount: hours, name });
  if (!res || !res.ok) { dvStatus('Speichern fehlgeschlagen: ' + (res && res.error || '?'), 'var(--danger)'); return false; }
  return true;
}

document.getElementById('dayview-list').addEventListener('change', async (e) => {
  const row = e.target.closest('.dv-line');
  if (!row) return;
  if (e.target.classList.contains('dv-hours') || e.target.classList.contains('dv-name')) {
    if (await dvSaveLine(row)) { dvStatus('Gespeichert ✓', 'var(--accent)'); await loadDayView(); }
  }
});
document.getElementById('dayview-list').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.classList.contains('dv-hours')) { e.preventDefault(); e.target.blur(); }
});
document.getElementById('dayview-list').addEventListener('click', async (e) => {
  const del = e.target.closest('.dv-del');
  if (del) {
    const row = del.closest('.dv-line');
    if (!row || !row.dataset.id) return;
    if (!confirm('Diesen Zeiteintrag in Odoo löschen?')) return;
    const res = await window.dt.dayViewDeleteLine(row.dataset.id);
    if (res && res.ok) { dvStatus('Gelöscht ✓', 'var(--accent)'); await loadDayView(); }
    else dvStatus('Löschen fehlgeschlagen: ' + (res && res.error || '?'), 'var(--danger)');
    return;
  }
  const add = e.target.closest('.dv-add');
  if (add) {
    const res = await window.dt.dayViewUpsertLine({ project_id: +add.dataset.pid, date: dayViewDate, unit_amount: 0.25, name: '/' });
    if (res && res.ok) { dvStatus('Eintrag angelegt ✓', 'var(--accent)'); await loadDayView(); }
    else dvStatus('Anlegen fehlgeschlagen: ' + (res && res.error || '?'), 'var(--danger)');
  }
});

async function dvRunScan() {
  if (dayViewScanning) return;
  dayViewScanning = true;
  const btn = document.getElementById('dayview-scan-btn');
  btn.disabled = true;
  const orig = btn.textContent;
  btn.textContent = '⏳ Scan…';
  dvStatus('Claude startet…', 'var(--accent2)');
  try {
    const extra = (document.getElementById('dayview-extra-prompt').value || '').trim();
    const res = await window.dt.dayViewScan(dayViewDate, extra);
    if (!res || !res.ok) {
      dvStatus('Scan fehlgeschlagen: ' + (res && res.error || '?'), 'var(--danger)');
    } else {
      const msg = `Scan fertig: ${res.scanned} Ordner, ${res.uploaded} Zeile(n) hochgeladen` + (res.traceFile ? ` · Trace: ${res.traceFile}` : '');
      dvStatus(msg, 'var(--accent)');
    }
  } catch (e) {
    dvStatus('Scan-Fehler: ' + e.message, 'var(--danger)');
  } finally {
    dayViewScanning = false;
    btn.disabled = false;
    btn.textContent = orig;
    await loadDayView();
  }
}

document.getElementById('dayview-close').addEventListener('click', closeDayView);
document.getElementById('dayview-prev').addEventListener('click', () => dvShift(-1));
document.getElementById('dayview-next').addEventListener('click', () => dvShift(1));
document.getElementById('dayview-date').addEventListener('click', () => { dvSetDate(dvTodayISO()); loadDayView(); });
document.getElementById('dayview-refresh').addEventListener('click', loadDayView);

// ── Edit task overlay ────────────────────────────────────────────────────
let editTaskId = null;

async function openEditOverlay(taskId) {
  editTaskId = taskId;
  const task = await window.dt.getTask(taskId);
  const taskData = tasks.find(t => t.id === taskId);
  let totalSec = taskData?.total_seconds || 0;
  if (taskData?.id === activeTaskId && tickStart) totalSec += (Date.now() - tickStart) / 1000;
  document.getElementById('edit-total-time').textContent = totalSec > 0 ? 'Gesamtzeit: ' + fmtSeconds(totalSec) : '';

  // Odoo link
  const odooLinkEl = document.getElementById('edit-odoo-link');
  const odooAnchor = document.getElementById('edit-odoo-anchor');
  if (taskData?.odoo_task_id) {
    odooAnchor.textContent = taskData.odoo_task_label || `Odoo Task #${taskData.odoo_task_id}`;
    odooAnchor.onclick = (e) => { e.preventDefault(); window.dt.openOdooTask(taskData.odoo_task_id); };
    odooLinkEl.style.display = '';
  } else {
    odooLinkEl.style.display = 'none';
  }

  const uploadBtn = document.getElementById('edit-upload');
  uploadBtn.disabled = false;
  const td = taskData || task;
  const unsyncedCount = td?.unsynced_count || 0;
  uploadBtn.onclick = null;
  if (unsyncedCount > 0 && td?.odoo_task_id) {
    const unsyncedSec = td?.unsynced_seconds || 0;
    uploadBtn.textContent = `Hochladen (${unsyncedCount} Slot${unsyncedCount > 1 ? 's' : ''}, ${fmtSeconds(unsyncedSec)})`;
    uploadBtn.style.display = '';
  } else if (unsyncedCount > 0) {
    uploadBtn.textContent = 'Erst Odoo-Task verknüpfen';
    uploadBtn.style.display = '';
    uploadBtn.disabled = false;
    uploadBtn.onclick = () => { closeEditOverlay(); openOdooSearch(taskId); };
  } else {
    uploadBtn.style.display = 'none';
  }

  document.getElementById('edit-title').value = task?.title || '';
  document.getElementById('edit-ticket').value = task?.ticket_ref || '';
  document.getElementById('edit-git-repo').value = task?.git_repo || '';
  document.getElementById('edit-git-branch').value = task?.git_branch || '';
  document.getElementById('edit-note').value = task?.note || '';
  document.getElementById('edit-slot-hours').value = '';
  document.getElementById('edit-slot-minutes').value = '';
  document.getElementById('edit-overlay').classList.add('visible');
  setTimeout(() => document.getElementById('edit-title').focus(), 50);
}

function closeEditOverlay() {
  editTaskId = null;
  document.getElementById('edit-overlay').classList.remove('visible');
}

document.getElementById('edit-close').addEventListener('click', closeEditOverlay);
document.getElementById('edit-overlay').addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeEditOverlay();
});

async function autoSaveEdit() {
  if (!editTaskId) return;
  await window.dt.updateTask({
    id: editTaskId,
    title: document.getElementById('edit-title').value.trim(),
    ticket_ref: document.getElementById('edit-ticket').value.trim(),
    note: document.getElementById('edit-note').value.trim(),
    private_notes: document.getElementById('edit-private-notes').value.trim(),
  });
  await load();
}

// Auto-save on blur for all edit fields
for (const id of ['edit-title', 'edit-ticket', 'edit-note', 'edit-private-notes']) {
  const el = document.getElementById(id);
  if (el) el.addEventListener('blur', autoSaveEdit);
}

document.getElementById('edit-save').addEventListener('click', async () => {
  await autoSaveEdit();
  closeEditOverlay();
  showToast('Task aktualisiert');
});

// Fetch commits into note
document.getElementById('edit-reset-time').addEventListener('click', async () => {
  if (!editTaskId) return;
  await window.dt.resetTimeslots(editTaskId);
  showToast('Zeiterfassung zurückgesetzt');
  await load();
});

document.getElementById('edit-upload').addEventListener('click', async () => {
  if (!editTaskId) return;
  await autoSaveEdit();
  const btn = document.getElementById('edit-upload');
  btn.disabled = true;
  btn.textContent = 'Wird hochgeladen…';
  const res = await window.dt.syncUnsynced(editTaskId);
  if (res.ok) {
    showToast(`${res.synced} Slot${res.synced > 1 ? 's' : ''} hochgeladen`);
  } else {
    showToast(`${res.synced} OK, ${res.failed} fehlgeschlagen: ${res.errors.join(', ')}`, '#e05c5c');
  }
  btn.disabled = false;
  await load();
  loadDaysStrip();
  await openEditOverlay(editTaskId);
});

document.getElementById('edit-fetch-commits').addEventListener('click', async () => {
  if (!editTaskId) return;
  const res = await window.dt.fetchCommits(editTaskId);
  if (!res.ok) { showToast('Fehler: ' + res.error, '#e05c5c'); return; }
  if (res.commits.length === 0) { showToast('Keine neuen Commits'); return; }
  const text = res.commits.map(c => `${c.short} ${c.message}`).join('\n');
  const note = document.getElementById('edit-note');
  note.value = note.value ? note.value + '\n\n' + text : text;
  showToast(`${res.commits.length} Commit${res.commits.length > 1 ? 's' : ''} eingefügt`);
});

// Add manual timeslot by duration
document.getElementById('edit-add-slot').addEventListener('click', async () => {
  if (!editTaskId) return;
  const h = parseInt(document.getElementById('edit-slot-hours').value) || 0;
  const m = parseInt(document.getElementById('edit-slot-minutes').value) || 0;
  if (h === 0 && m === 0) { showToast('Dauer angeben', '#e05c5c'); return; }
  await window.dt.addTimeslot({ taskId: editTaskId, durationMinutes: h * 60 + m });
  document.getElementById('edit-slot-hours').value = '';
  document.getElementById('edit-slot-minutes').value = '';
  showToast(`${h}h ${m}min eingetragen`);
  await load();
});

// ── Git Commits overlay ──────────────────────────────────────────────────
let commitsTaskId = null;
let lastCommits = [];

async function openCommitsOverlay(taskId) {
  commitsTaskId = taskId;
  const overlay = document.getElementById('commits-overlay');
  overlay.classList.add('visible');
  document.getElementById('commits-status').textContent = 'Lade Commits…';
  document.getElementById('commits-list').innerHTML = '';

  const res = await window.dt.fetchCommits(taskId);
  if (!res.ok) {
    document.getElementById('commits-status').textContent = 'Fehler: ' + res.error;
    lastCommits = [];
    return;
  }

  lastCommits = res.commits;
  if (lastCommits.length === 0) {
    document.getElementById('commits-status').textContent = 'Keine neuen Commits';
    return;
  }

  document.getElementById('commits-status').textContent = res.isNew
    ? `Letzte ${lastCommits.length} Commits (erstmaliger Abruf)`
    : `${lastCommits.length} neue Commit${lastCommits.length > 1 ? 's' : ''}`;

  document.getElementById('commits-list').innerHTML = lastCommits.map(c => `
    <div class="commit-item${res.isNew ? '' : ' new-commit'}">
      <div class="commit-msg">${escapeHtml(c.message)}</div>
      <div class="commit-meta">
        <span class="commit-sha">${escapeHtml(c.short)}</span>
        <span>${escapeHtml(c.author)}</span>
        <span>${escapeHtml(c.date)}</span>
      </div>
    </div>
  `).join('');
}

function closeCommitsOverlay() {
  commitsTaskId = null;
  document.getElementById('commits-overlay').classList.remove('visible');
}

document.getElementById('commits-close').addEventListener('click', closeCommitsOverlay);

document.getElementById('commits-copy-btn').addEventListener('click', () => {
  if (lastCommits.length === 0) return;
  const text = lastCommits.map(c => `${c.short} ${c.message} (${c.author}, ${c.date})`).join('\n');
  navigator.clipboard.writeText(text);
  showToast('Commits kopiert');
});

document.getElementById('commits-overlay').addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeCommitsOverlay();
});

async function openDoneHistory() {
  const overlay = document.getElementById('done-history-overlay');
  const list = document.getElementById('done-history-list');
  list.innerHTML = '<div id="done-history-empty">Lädt…</div>';
  overlay.classList.add('visible');
  const res = await window.dt.doneHistory();
  const rows = (res && res.tasks) || [];
  if (!rows.length) {
    list.innerHTML = '<div id="done-history-empty">Keine erledigten Tasks mit erfasster Zeit.</div>';
    return;
  }
  function fmtWhen(t) {
    return t.done_at || t.last_stop || t.date || '';
  }
  list.innerHTML = rows.map(t => {
    const when = fmtWhen(t).replace('T', ' ').slice(0, 16);
    const label = escapeHtml(t.odoo_task_label || t.title || '');
    const ticket = t.ticket_ref ? `<small>#${escapeHtml(t.ticket_ref)}</small>` : '';
    const secs = Math.round(t.total_seconds || 0);
    return `<div class="dh-row"><span class="dh-date">${escapeHtml(when)}</span><span class="dh-title">${label}${ticket}</span><span class="dh-time">${fmtSeconds(secs)}</span></div>`;
  }).join('');
}
document.getElementById('btn-done-history').addEventListener('click', openDoneHistory);
document.getElementById('done-history-close').addEventListener('click', () => {
  document.getElementById('done-history-overlay').classList.remove('visible');

function updateFilterLabel() {

  const pendingCount = tasks.filter(t => t.unsynced_count > 0).length;
  const btnP = document.getElementById('filter-pending');
  btnP.textContent = pendingCount > 0 ? `upload (${pendingCount})` : 'upload';
}

// ── Task Merge ───────────────────────────────────────────────────────────
function startMerge(sourceId) {
  if (mergeSourceId === sourceId) { mergeSourceId = null; renderTasks(); return; }
  mergeSourceId = sourceId;
  renderTasks();
  showToast('Ziel-Task anklicken zum Mergen', '#5b9cf6');
}

async function doMerge(targetId) {
  const sourceId = mergeSourceId;
  if (!sourceId || sourceId === targetId) { mergeSourceId = null; renderTasks(); return; }
  const src = tasks.find(t => t.id === sourceId);
  const tgt = tasks.find(t => t.id === targetId);

  // Sind beide mit unterschiedlichen Odoo-Tickets verknüpft? Dann fragen, ob
  // die Tickets in Odoo auch zusammengeführt werden sollen.
  let mergeOdoo = false;
  if (src && tgt && src.odoo_task_id && tgt.odoo_task_id && src.odoo_task_id !== tgt.odoo_task_id) {
    mergeOdoo = confirm(
      'Beide Aufgaben sind mit unterschiedlichen Odoo-Tickets verknüpft.\n\n' +
      'Quelle: ' + (src.odoo_task_label || ('#' + src.odoo_task_id)) + '\n' +
      'Ziel:   ' + (tgt.odoo_task_label || ('#' + tgt.odoo_task_id)) + '\n\n' +
      'Sollen die Odoo-Tickets auch zusammengeführt werden?\n' +
      'Das Quell-Ticket wird dann in Odoo auf „Erledigt" gesetzt und erhält einen ' +
      'Vermerk, dass es mit dem Ziel-Ticket zusammengeführt wurde.\n\n' +
      'OK = Odoo-Tickets mergen   ·   Abbrechen = nur lokal zusammenführen'
    );
  }

  mergeSourceId = null;
  const res = await window.dt.mergeTasks({ targetId, sourceId, mergeOdoo });
  if (res.ok) {
    let msg = 'Tasks zusammengeführt';
    if (res.odooMerge) {
      if (res.odooMerge.ok) msg += res.odooMerge.done ? ' · Odoo-Ticket erledigt + Vermerk' : ' · Odoo-Vermerk gesetzt (Done-Stage fehlte)';
      else msg += ' · Odoo-Merge fehlgeschlagen: ' + (res.odooMerge.error || '');
    }
    showToast(msg);
    await load();
  } else {
    showToast('Merge fehlgeschlagen: ' + res.error, '#e05c5c');
  }
}

// Mini-bar: drag to move window, click to expand
(() => {
  const miniBar = document.getElementById('mini-bar');
  let drag = null;
  const THRESHOLD = 4;

  miniBar.addEventListener('mousedown', async (e) => {
    if (e.button !== 0) return;
    if (!document.body.classList.contains('mini')) return;
    window.dt.miniDragStart();
    const [wx, wy] = await window.dt.getWindowPos();
    drag = { sx: e.screenX, sy: e.screenY, wx, wy, moved: false };
  });

  window.addEventListener('mousemove', (e) => {
    if (!drag) return;
    const dx = e.screenX - drag.sx;
    const dy = e.screenY - drag.sy;
    if (!drag.moved && (Math.abs(dx) > THRESHOLD || Math.abs(dy) > THRESHOLD)) {
      drag.moved = true;
    }
    if (drag.moved) window.dt.setWindowPos(drag.wx + dx, drag.wy + dy);
  });

  window.addEventListener('mouseup', (e) => {
    if (!drag) return;
    const wasMoved = drag.moved;
    drag = null;
    window.dt.miniDragEnd();
    if (!wasMoved) window.dt.expandWindow();
  });
})();
