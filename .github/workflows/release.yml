name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.compile.outputs.release_body }}
    steps:
      - uses: actions/checkout@v4

      - name: Compile changelog from fragments
        id: compile
        run: |
          VERSION="${GITHUB_REF_NAME}"
          BODY=""
          FEATURES=""
          FIXES=""
          MISC=""

          for f in changes/*.feature; do
            [ -f "$f" ] || continue
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              FEATURES="${FEATURES}- ${line}\n"
            done < "$f"
          done

          for f in changes/*.fix; do
            [ -f "$f" ] || continue
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              FIXES="${FIXES}- ${line}\n"
            done < "$f"
          done

          for f in changes/*.misc; do
            [ -f "$f" ] || continue
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              MISC="${MISC}- ${line}\n"
            done < "$f"
          done

          if [ -n "$FEATURES" ]; then
            BODY="${BODY}## Features\n${FEATURES}\n"
          fi
          if [ -n "$FIXES" ]; then
            BODY="${BODY}## Fixes\n${FIXES}\n"
          fi
          if [ -n "$MISC" ]; then
            BODY="${BODY}## Misc\n${MISC}\n"
          fi

          # If no fragments found, fall back to tag name
          if [ -z "$BODY" ]; then
            BODY="Release ${VERSION}"
          fi

          # Append new section to CHANGELOG.md
          HEADER="## ${VERSION}"
          CHANGELOG_SECTION="${HEADER}\n\n${BODY}"

          # Insert after the first line (# Changelog)
          {
            head -n 1 CHANGELOG.md
            echo ""
            printf '%b' "$CHANGELOG_SECTION"
            tail -n +2 CHANGELOG.md
          } > CHANGELOG.new.md
          mv CHANGELOG.new.md CHANGELOG.md

          # Remove consumed fragments (keep README.md)
          find changes/ -maxdepth 1 -type f \
            \( -name '*.feature' -o -name '*.fix' -o -name '*.misc' \) -delete

          # Commit updated changelog
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md changes/
          git commit -m "Update CHANGELOG for ${VERSION}" || true
          git push origin HEAD:main || true

          # Write release body to output (multiline-safe)
          {
            echo "release_body<<RELEASE_EOF"
            printf '%b' "$BODY"
            echo "RELEASE_EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: changelog
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npx electron-rebuild

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "const p=require('./package.json'); p.version='$VERSION'; require('fs').writeFileSync('package.json', JSON.stringify(p,null,2)+'\n')"
        shell: bash

      - name: Build
        run: npx electron-builder --${{ matrix.platform == 'mac' && 'mac' || 'win' }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DayTask-${{ matrix.platform }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: warn

  release:
    needs: [changelog, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body: ${{ needs.changelog.outputs.release_body }}
