name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile changelog from fragments
        id: compile
        run: |
          VERSION="${GITHUB_REF_NAME}"
          BODY=""
          FEATURES=""
          FIXES=""
          MISC=""

          for f in changes/*.feature; do
            [ -f "$f" ] || continue
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              FEATURES="${FEATURES}- ${line}\n"
            done < "$f"
          done

          for f in changes/*.fix; do
            [ -f "$f" ] || continue
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              FIXES="${FIXES}- ${line}\n"
            done < "$f"
          done

          for f in changes/*.misc; do
            [ -f "$f" ] || continue
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              MISC="${MISC}- ${line}\n"
            done < "$f"
          done

          if [ -n "$FEATURES" ]; then
            BODY="${BODY}## Features\n${FEATURES}\n"
          fi
          if [ -n "$FIXES" ]; then
            BODY="${BODY}## Fixes\n${FIXES}\n"
          fi
          if [ -n "$MISC" ]; then
            BODY="${BODY}## Misc\n${MISC}\n"
          fi

          # If no fragments found, fall back to tag name
          if [ -z "$BODY" ]; then
            BODY="Release ${VERSION}"
          fi

          # Append new section to CHANGELOG.md
          HEADER="## ${VERSION}"
          CHANGELOG_SECTION="${HEADER}\n\n${BODY}"

          # Insert after the first line (# Changelog)
          {
            head -n 1 CHANGELOG.md
            echo ""
            printf '%b' "$CHANGELOG_SECTION"
            tail -n +2 CHANGELOG.md
          } > CHANGELOG.new.md
          mv CHANGELOG.new.md CHANGELOG.md

          # Remove consumed fragments (keep README.md)
          find changes/ -maxdepth 1 -type f \
            \( -name '*.feature' -o -name '*.fix' -o -name '*.misc' \) -delete

          # Commit updated changelog
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md changes/
          git commit -m "Update CHANGELOG for ${VERSION}" || true
          git push origin HEAD:main || true

          # Write release body to file for the release step
          printf '%b' "$BODY" > /tmp/release_body.md

      - name: Create GitHub Release (empty)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file /tmp/release_body.md \
            --repo "$GITHUB_REPOSITORY"

  build:
    needs: changelog
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npx electron-rebuild

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "const p=require('./package.json'); p.version='$VERSION'; require('fs').writeFileSync('package.json', JSON.stringify(p,null,2)+'\n')"
        shell: bash

      - name: Build
        run: npx electron-builder --${{ matrix.platform == 'mac' && 'mac' || 'win' }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          shopt -s nullglob
          # Installer + die von electron-updater benoetigten Auto-Update-Artefakte
          # (Update-Manifest latest*.yml, mac-.zip, Blockmaps). Ohne diese findet
          # der Updater im Client kein Update.
          files=(dist/*.dmg dist/*.exe dist/*.AppImage dist/*-mac.zip dist/*.blockmap dist/latest*.yml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No build artifacts found"
            exit 1
          fi
          gh release upload "$VERSION" "${files[@]}" \
            --clobber --repo "$GITHUB_REPOSITORY"
