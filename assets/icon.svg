<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1117"/>
      <stop offset="100%" stop-color="#1e2535"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5b9cf6"/>
      <stop offset="100%" stop-color="#3dd68c"/>
    </linearGradient>
    <linearGradient id="check" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3dd68c"/>
      <stop offset="100%" stop-color="#2ab873"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Subtle grid lines (daily planner feel) -->
  <g opacity=".06" stroke="#5b9cf6" stroke-width="1">
    <line x1="80" y1="160" x2="432" y2="160"/>
    <line x1="80" y1="220" x2="432" y2="220"/>
    <line x1="80" y1="280" x2="432" y2="280"/>
    <line x1="80" y1="340" x2="432" y2="340"/>
    <line x1="80" y1="400" x2="432" y2="400"/>
  </g>

  <!-- Clock/timer arc (top-left area) -->
  <circle cx="170" cy="150" r="52" fill="none" stroke="#252d40" stroke-width="6"/>
  <path d="M170 98 A52 52 0 1 1 122 172" fill="none" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
  <!-- Clock hands -->
  <line x1="170" y1="150" x2="170" y2="118" stroke="#d4dbe8" stroke-width="4" stroke-linecap="round"/>
  <line x1="170" y1="150" x2="192" y2="142" stroke="#5b9cf6" stroke-width="3" stroke-linecap="round"/>
  <circle cx="170" cy="150" r="4" fill="#5b9cf6"/>

  <!-- Checkmark task 1 (done) -->
  <rect x="82" y="228" width="28" height="28" rx="6" fill="url(#check)"/>
  <polyline points="90,243 97,251 108,237" fill="none" stroke="#0f1117" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="126" y1="242" x2="320" y2="242" stroke="#3a4560" stroke-width="4" stroke-linecap="round"/>

  <!-- Open task 2 (active, with timer glow) -->
  <rect x="82" y="288" width="28" height="28" rx="6" fill="none" stroke="url(#accent)" stroke-width="2.5"/>
  <circle cx="96" cy="302" r="18" fill="#f5a623" opacity=".08"/>
  <line x1="126" y1="302" x2="360" y2="302" stroke="#d4dbe8" stroke-width="4" stroke-linecap="round"/>
  <!-- tiny play indicator -->
  <polygon points="380,295 380,309 392,302" fill="#f5a623"/>

  <!-- Open task 3 -->
  <rect x="82" y="348" width="28" height="28" rx="6" fill="none" stroke="#252d40" stroke-width="2.5"/>
  <line x1="126" y1="362" x2="290" y2="362" stroke="#5a6480" stroke-width="4" stroke-linecap="round"/>

  <!-- "DT" monogram (bottom-right) -->
  <text x="350" y="168" font-family="monospace" font-weight="700" font-size="72" fill="url(#accent)" letter-spacing="-2">DT</text>

  <!-- Accent dot (bottom decoration) -->
  <circle cx="256" cy="440" r="6" fill="#3dd68c"/>
  <circle cx="236" cy="440" r="3" fill="#5b9cf6" opacity=".5"/>
  <circle cx="276" cy="440" r="3" fill="#5b9cf6" opacity=".5"/>
</svg>
